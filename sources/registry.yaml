# V2 §5 / P1-1 Source Registry —— 归并表（source group）外置
#
# 同门户多频道（news.sina.com.cn + finance.sina.com.cn）或同集团跨域名
# （eastmoney.com + 1234567.com.cn）合并为单一独立信源组（grp:xxx）。
# 与 claims.py / intelligence.py 的 §7.1 判定口径保持一致。
#
# 设计约束：本仓库是零依赖工程（collect.py / intelligence.py 仅用标准库），
# 因此本文件由 source_registry.py 内置的极简 YAML 子集解析器加载，不引入 PyYAML。
# 仅使用：整行注释(#)、块映射、块序列、行内流序列 [a, b, c]、纯量字符串。
# 请勿使用锚点 / 多行字符串 / 行内注释，以免超出解析器能力。

# 多段后缀：只取最后两段会切错（sina.com.cn -> com.cn），必须保留三段。
multipart_suffixes:
  - com.cn
  - net.cn
  - org.cn
  - gov.cn
  - edu.cn
  - ac.cn
  - com.hk
  - net.hk
  - org.hk
  - gov.hk
  - com.tw
  - net.tw
  - org.tw
  - co.jp
  - or.jp
  - ne.jp
  - ac.jp
  - go.jp
  - co.uk
  - org.uk
  - ac.uk
  - gov.uk
  - me.uk
  - com.au
  - net.au
  - org.au
  - com.br
  - com.sg
  - co.kr
  - co.in

# 已知转载/聚合平台组：同一稿件出现在此类平台不单独构成新的独立信源。
# 注：grp:163 当前为历史遗留项，源码未将任何域名映射到该组（163.com 实际归 grp:netease），待复核。
syndication_groups: [grp:toutiao, grp:baidu, grp:sohu, grp:163]


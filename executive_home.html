<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsureAI · Executive Home</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#172033;background:#f4f6f8;line-height:1.5}
*{box-sizing:border-box}
body{margin:0}
.shell{max-width:1340px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:800}
.brand span{color:#f97316}
.muted{color:#667085;font-size:13px}
.btn{padding:8px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;text-decoration:none;color:#344054;font-size:13px}
.btn:hover{border-color:#98a2b3}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px}
.kpi .n{font-size:26px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12px;color:#667085;margin-top:4px}
.kpi .s{font-size:11px;color:#98a2b3;margin-top:2px}
.rows{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;min-width:0}
.title{font-size:17px;font-weight:750;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:700;color:#344054;background:#f2f4f7;border-radius:999px;padding:2px 9px}
.item{padding:12px 0;border-top:1px solid #eaecf0}
.item:first-child{border-top:0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row strong{font-size:14px;font-weight:650}
.meta{color:#667085;font-size:12px;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{display:inline-flex;padding:2px 8px;border-radius:999px;background:#f2f4f7;font-size:11px;color:#475467}
.hot{color:#b42318;background:#fef3f2}
.mid{color:#b54708;background:#fffaeb}
.low{color:#067647;background:#ecfdf3}
.wl{color:#6941c6;background:#f4ebff}
.chg{color:#175cd3;background:#eff8ff}
.ce{color:#475467;background:#f8fafc;border:1px solid #e4e7ec;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.t1{color:#b42318;background:#fef3f2}
.t2{color:#6941c6;background:#f4ebff}
.t3{color:#475467;background:#f2f4f7}
.empty{text-align:center;padding:28px;color:#667085;font-size:13px}
.footer{margin-top:8px;color:#667085;font-size:12px;border-top:1px solid #eaecf0;padding-top:14px}
.kg-card{margin-bottom:18px}
.kg-open{margin-left:auto;display:flex;gap:8px}
.kg-open .btn{font-size:12px;padding:5px 10px}
.kg-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
.kg-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kg-kpi{background:#f8fafc;border:1px solid #eef2f5;border-radius:10px;padding:10px}
.kg-kpi .n{font-size:20px;font-weight:800}
.kg-kpi .l{font-size:11px;color:#667085;margin-top:2px}
.kg-h{font-size:13px;font-weight:700;color:#475467;margin:4px 0 10px}
.kg-row{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.kg-row .nm{color:#344054;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg-bar{height:8px;border-radius:999px;background:#dbeafe}
.kg-row b{text-align:right;color:#344054}
@media(max-width:760px){.kg-wrap{grid-template-columns:1fr}.kg-kpis{grid-template-columns:repeat(2,1fr)}}
.pm-card{margin-bottom:18px}
.pm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pm-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.pm-kpi{background:#f8fafc;border:1px solid #eef2f5;border-radius:10px;padding:10px}
.pm-kpi .n{font-size:20px;font-weight:800}
.pm-kpi .l{font-size:11px;color:#667085;margin-top:2px}
.pm-note{background:#fffaeb;border:1px solid #fedf89;color:#b54708;border-radius:10px;padding:9px 11px;font-size:12px;margin:8px 0 4px;line-height:1.55}
.pm-wl{padding:9px 0;border-top:1px solid #f2f4f7}
.pm-wl:first-child{border-top:0}
.pm-wl .nm{font-size:13.5px;font-weight:650;color:#172033}
.pm-ent{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.pm-ent .e{background:#f4ebff;color:#6941c6;border-radius:999px;padding:3px 9px;font-size:11.5px}
.pm-ent .e.ov{background:#ecfdf3;color:#067647}
.pm-gap{padding:8px 0;border-top:1px solid #f2f4f7;font-size:12px}
.pm-gap:first-child{border-top:0}
.pm-gap .d{font-weight:650;color:#344054}
.pm-gap .r{color:#667085;margin-top:2px;line-height:1.5}
.pm-gap .u{color:#175cd3;margin-top:2px}
.st{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-right:6px}
.st.empty,.st.insufficient_sample{background:#fef3f2;color:#b42318}
.st.structurally_unavailable{background:#f2f4f7;color:#475467}
.st.upstream_noise{background:#fffaeb;color:#b54708}
.pm-caveat{color:#667085;font-size:11.5px;margin-top:8px;line-height:1.5}
.sb-card{margin-bottom:18px}
.sb-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sb-role{background:#f8fafc;border:1px solid #eef2f5;border-radius:12px;padding:14px;min-width:0}
.sb-role h4{font-size:15px;font-weight:750;margin:0 0 2px;color:#172033}
.sb-role .d{font-size:12px;color:#667085;margin-bottom:10px}
.sb-k{font-size:12px;font-weight:700;color:#475467;margin:9px 0 4px}
.sb-ent{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.sb-ent .e{background:#eff8ff;color:#175cd3;border-radius:999px;padding:3px 9px;font-size:11.5px}
@media(max-width:760px){.sb-wrap{grid-template-columns:1fr}}
@media(max-width:760px){.pm-wrap{grid-template-columns:1fr}.pm-kpis{grid-template-columns:repeat(2,1fr)}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div class="brand">Insure<span>AI</span> · Executive Home</div>
      <div class="muted">管理层情报工作台 — 固定三行出口（需决策 / 语义变化 / 复核队列）。只聚合既有 artifact 中的事实，不补写未验证结论。数据随采集/复核重跑自动更新。</div>
    </div>
    <div>
      <a class="btn" href="./intelligence.html">Intelligence</a>
      <a class="btn" href="./review-ui.html">Human Review</a>
      <a class="btn" href="./">主站</a>
      <button class="btn" id="refresh" type="button">刷新</button>
    </div>
  </div>

  <div id="kpis" class="kpi-grid"><div class="empty">加载中…</div></div>

  <div class="rows">
    <section class="card">
      <div class="title">需决策 <span id="c-pend" class="badge"></span>
        <span class="kg-open"><a class="btn" href="./review-ui.html">去复核 →</a></span></div>
      <div id="pend" class="list"></div>
    </section>
    <section class="card">
      <div class="title">语义变化 <span id="c-chg" class="badge"></span>
        <span class="kg-open"><a class="btn" href="./p2_alerts.json">S4 原始</a></span></div>
      <div id="chg" class="list"></div>
    </section>
    <section class="card">
      <div class="title">复核队列 <span id="c-rq" class="badge"></span>
        <span class="kg-open"><a class="btn" href="./review-ui.html">前往复核页 →</a></span></div>
      <div id="rq" class="list"></div>
    </section>
  </div>

  <div class="card kg-card">
    <div class="title">Knowledge Graph 概览 <span id="c-kg" class="badge"></span>
      <span class="kg-open"><a class="btn" href="./knowledge-graph.html">实体查询</a><a class="btn" href="./kg-visual.html">力导向图 →</a></span>
    </div>
    <div id="kg" class="kg-wrap"><div class="empty">加载中…</div></div>
  </div>

  <div class="card pm-card">
    <div class="title">Personal Memory <span id="c-pm" class="badge"></span>
      <span class="kg-open"><a class="btn" href="./review-ui.html">去复核</a></span>
    </div>
    <div id="pm" class="pm-wrap"><div class="empty">加载中…</div></div>
  </div>

  <div class="card sb-card">
    <div class="title">Second Brain · 角色视图 <span id="c-sb" class="badge"></span>
      <span class="kg-open"><a class="btn" href="./personal_memory.html">Personal Memory →</a></span>
    </div>
    <div id="sb" class="sb-wrap"><div class="empty">加载中…</div></div>
  </div>

  <div class="footer" id="release"></div>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{ if(!d) return '—'; try{ return new Date(d).toISOString().slice(0,10);}catch(e){ return String(d).slice(0,10);} };
const prClass=v=> (v==null)?'tag':(v>=80?'hot':v>=60?'mid':'low');
const TIER_RANK={T1_system:3,T2_personal:2,T3_standard:1};
const admTag=a=>{ const t=a.admission; if(t==='T1_system') return `<span class="tag t1">系统级 T1</span>`; if(t==='T2_personal') return `<span class="tag t2">个人级 T2</span>`; return ''; };

async function get(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw Error(u+' → HTTP '+r.status); return r.json(); }

function render(){
  Promise.all([
    get('./p2_daily_brief.json'),
    get('./review_queue.json'),
    get('./p2_state.json'),
    // S4 语义告警：语义变化 行换源
    get('./p2_alerts.json').catch(()=>null),
    // S5 决策漏斗：需决策 行换源
    get('./decisions_pending.json').catch(()=>null),
    // 单一事实源：event_id → canonical_event_id 映射，事件卡统一锚定
    get('./canonical_events.json').catch(()=>null),
    // KG 单独降级
    get('./knowledge_graph.json').catch(()=>null),
    get('./p2_personal_memory.json').catch(()=>null),
    get('./second_brain.json').catch(()=>null)
  ]).then(([brief,queue,state,alerts,pending,canon,kg,mem,sb])=>{
    const B=brief.brief||[], Q=queue.items||[], W=(state.watchlists||[]).filter(w=>w.enabled!==false);
    // 单一事实源：所有事件卡以 canonical_event_id 为稳定锚点（S1 Registry 映射）
    const CEMAP=(canon&&canon.by_event_id)||{};
    const ceOf=e=>(e&&(e.canonical_event_id||CEMAP[e.event_id]))||null;
    const ceTag=e=>{ const c=ceOf(e); return c?`<span class="tag ce" title="canonical_event_id">⌖ ${esc(c)}</span>`:''; };

    // ---- KPI strip（主数字 = 今日情报；89 待决留复核页，不并入主数字）----
    const wlHits=brief.watchlist_hits ?? B.reduce((n,e)=>n+((e.watchlist_matches||[]).length),0);
    const risks=Q.filter(i=>i.trust_level==='low');
    const acted=Q.filter(i=>i.decision).sort((a,b)=>(b.priority||0)-(a.priority||0));
    const alertList=alerts&&Array.isArray(alerts.semantic_alerts)?alerts.semantic_alerts:[];
    const changes=alertList;
    const pendMeta=(pending&&pending.meta)||{};
    const pendCount=pendMeta.pending ?? (pending&&Array.isArray(pending.top_pending)?pending.top_pending.length:0);
    const kpis=[
      ['今日情报', B.length, 'Daily Brief 事件（主数字）'],
      ['需决策', pendCount, 'S5 决策漏斗 · 待拍板'],
      ['语义变化', changes.length, 'S4 语义告警'],
      ['复核队列', Q.length, 'review_queue（留复核页）'],
      ['新兴风险', risks.length, '低可信待证'],
      ['近期已决', acted.length, '已落决策']
    ];
    document.getElementById('kpis').innerHTML=kpis.map(k=>
      `<div class="kpi"><div class="n">${esc(k[1])}</div><div class="l">${esc(k[0])}</div><div class="s">${esc(k[2])}</div></div>`).join('');

    // ---- 需决策（X1 换源：S5 决策漏斗，单一事实源锚定）----
    const pendItems=(pending&&Array.isArray(pending.top_pending))?pending.top_pending:[];
    const decidedN=pendMeta.decided??0, pendingN=pendMeta.pending??pendItems.length;
    const tiers=pendMeta.pending_by_tier||{};
    const tierCls={now:'hot',soon:'mid',watch:'low'};
    setBadge('c-pend', pendingN);
    document.getElementById('pend').innerHTML=
      `<div class="tags" style="margin:0 0 10px">`+
        `<span class="tag">待决 ${esc(pendingN)}</span>`+
        `<span class="tag hot">now ${esc(tiers.now??'?')}</span>`+
        `<span class="tag mid">soon ${esc(tiers.soon??'?')}</span>`+
        `<span class="tag low">watch ${esc(tiers.watch??'?')}</span>`+
        `<span class="tag">已决 ${esc(decidedN)}</span>`+
        (pendMeta.reached_threshold?`<span class="tag low">偏好已解锁</span>`:`<span class="tag">样本 ${esc(pendMeta.decided_sample_size??'?')}/30 未解锁</span>`)+
      `</div>`+
      (pendItems.length?pendItems.map(i=>`
      <div class="item">
        <div class="row"><strong>${esc(i.title)}</strong><span class="tag ${tierCls[i.tier]||'low'}">${esc(i.tier||'watch')}</span></div>
        <div class="meta">${esc(i.topic||'')} · P${esc(i.priority??'—')} · trust ${esc(i.trust_level||'—')}</div>
        <div class="tags">${(i.reason_types||[]).map(r=>`<span class="tag">${esc(r)}</span>`).join('')}${ceTag(i)}</div>
      </div>`).join(''):'<div class="empty">无待决决策（S5 漏斗为空）</div>');

    // ---- 语义变化（X1 换源：S4 语义告警，两层准入 + 单一事实源锚定）----
    setBadge('c-chg', changes.length);
    document.getElementById('chg').innerHTML=changes.length?changes.slice().sort((a,b)=>
        ((b.severity==='high')-(a.severity==='high'))||(TIER_RANK[b.admission]||0)-(TIER_RANK[a.admission]||0)||((b.priority||0)-(a.priority||0))
      ).map(a=>`
      <div class="item">
        <div class="row"><strong>${esc(a.title)}</strong><span class="tag ${a.severity==='high'?'hot':prClass(a.priority)}">${esc(String(a.type||'alert').replace('EVENT_','').replace(/_/g,' ').toLowerCase())}</span></div>
        <div class="meta">${esc(a.topic||'')} · 严重度 ${esc(a.severity||'—')} · 依据 ${esc(a.basis||'—')}</div>
        <div class="tags"><span class="tag chg">${esc(a.type||'alert')}</span>${admTag(a)}${a.rationale?`<span class="tag low">${esc(String(a.rationale).slice(0,46))}</span>`:''}${ceTag(a)}</div>
      </div>`).join(''):'<div class="empty">暂无语义变化（S4 语义告警为空）</div>';

    // ---- 复核队列（review_queue；89 待决留复核页，不进主数字）----
    const rqItems=Q.slice().sort((a,b)=>(b.priority||0)-(a.priority||0)).slice(0,8);
    setBadge('c-rq', Q.length);
    document.getElementById('rq').innerHTML=
      `<div class="tags" style="margin:0 0 10px"><span class="tag">队列 ${esc(Q.length)} 条</span><span class="tag low">留复核页（不计入主数字）</span><a class="tag chg" href="./review-ui.html">前往复核页 →</a></div>`+
      (rqItems.length?rqItems.map(i=>`
      <div class="item">
        <div class="row"><strong>${esc(i.title)}</strong><span class="tag ${prClass(i.priority)}">P${esc(i.priority??'—')}</span></div>
        <div class="meta">${esc(i.event_type||'')} · trust ${esc(i.trust_level||'—')} · 信源 ${esc(i.source_count??'—')}</div>
        <div class="tags">${(i.reasons||[]).map(r=>`<span class="tag">${esc(r.type||'')}</span>`).join('')}${ceTag(i)}</div>
      </div>`).join(''):'<div class="empty">复核队列为空</div>');

    document.getElementById('release').innerHTML=
      `固定三行出口：需决策 ← decisions_pending.json（S5 ${esc(pendCount)} 待决）· 语义变化 ← p2_alerts.json（S4 ${esc(changes.length)} 条）· 复核队列 ← review_queue.json（${esc(Q.length)} 条，留复核页）· `+
      `统一事件身份 ← canonical_events.json（S1 ${esc((canon&&canon.count)||'?')} 个 canonical_event_id）· `+
      `其余：p2_daily_brief.json（${fmt(brief.generated_at)}）· p2_state.json（${W.length} 个 Watchlist）· `+
      (kg?`knowledge_graph.json（v${esc(kg.version)}）· `:'')+
      (sb?`second_brain.json（v${esc(sb.version)}）已接入。`:'')+
      ` 事件总数 ${esc(brief.event_count??'—')}。本站仅聚合既有 artifact，不自动补写未验证结论。`;
    loadKG(kg);
    loadMemory(mem);
    loadSecondBrain(sb);
  }).catch(e=>{
    document.getElementById('kpis').innerHTML='<div class="empty">数据加载失败：'+esc(e.message)+'。请通过 GitHub Pages 站点访问，不要直接以本地文件打开。</div>';
  });
}
// Knowledge Graph 渲染
function loadKG(kg){
  (async()=>{
    if(!kg){ setBadge('c-kg','不可用'); document.getElementById('kg').innerHTML='<div class="empty">知识图谱数据暂不可用（knowledge_graph.json 未生成或加载失败）。其余模块不受影响。</div>'; return; }
    const S=kg.stats||{}, nt=S.node_types||{};
    const rel={}; for(const e of (kg.edges||[])) rel[e.relationship]=(rel[e.relationship]||0)+1;
    const topRel=Object.entries(rel).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const topType=Object.entries(nt).sort((a,b)=>b[1]-a[1]);
    const maxT=Math.max(1,...topType.map(x=>x[1])), maxR=Math.max(1,...topRel.map(x=>x[1]));
    setBadge('c-kg', (S.node_count??'?')+' 节点 / '+(S.edge_count??'?')+' 关系');
    document.getElementById('kg').innerHTML=
      `<div class="kg-kpis">`+[['节点',S.node_count],['关系',S.edge_count],['事件',S.event_count],['Claim',S.claim_count],['Topic',nt.Topic]].map(x=>
        `<div class="kg-kpi"><div class="n">${esc(x[1]??'—')}</div><div class="l">${esc(x[0])}</div></div>`).join('')+`</div>`+
      `<div><div class="kg-h">顶级实体类型</div>`+topType.map(([t,c])=>
        `<div class="kg-row"><span class="nm">${esc(t)}</span><span class="kg-bar" style="width:${Math.round(c/maxT*100)}%"></span><b>${esc(c)}</b></div>`).join('')+`</div>`+
      `<div><div class="kg-h">顶级关系</div>`+topRel.map(([r,c])=>
        `<div class="kg-row"><span class="nm">${esc(r)}</span><span class="kg-bar" style="width:${Math.round(c/maxR*100)}%"></span><b>${esc(c)}</b></div>`).join('')+`</div>`;
  })().catch(e=>{ setBadge('c-kg','错误'); document.getElementById('kg').innerHTML='<div class="empty">知识图谱渲染失败：'+esc(e.message)+'。其余模块不受影响。</div>'; });
}
// Personal Memory 卡片
function loadMemory(mem){
  (async()=>{
    if(!mem){ setBadge('c-pm','不可用'); document.getElementById('pm').innerHTML='<div class="empty">个人记忆层暂不可用（p2_personal_memory.json 未生成）。其余模块不受影响。</div>'; return; }
    const wlMap=mem.watchlists||{}; const W=wlMap.items||[];
    const me=mem.memory_entries||[];
    const obs=mem.decisions?.observations||{};
    const ea=mem.entity_affinity||{};
    const gaps=mem.gaps||[];
    const blocked=mem.decisions?.conclusion_blocked;
    setBadge('c-pm', W.length+' 关注 / '+me.length+' 记忆');
    document.getElementById('pm').innerHTML=
      `<div class="pm-kpis">`+[
        ['关注', W.length],['记忆', me.length],['行动实体', (ea.acted_entities||[]).length],
        ['观察样本', obs.sample_size||me.length],['推断缺口', gaps.length]
      ].map(x=>`<div class="pm-kpi"><div class="n">${esc(x[1])}</div><div class="l">${esc(x[0])}</div></div>`).join('')+`</div>`+
      `<div class="pm-wrap">`+
        `<div><div class="kg-h">关注意图（Watchlists）</div>`+(W.length?W.map(w=>`
          <div class="pm-wl"><div class="nm">${esc(w.name||w.id)}</div>
          <div class="pm-ent">${(w.topics||[]).map(t=>`<span class="e">${esc(t)}</span>`).join('')}${(w.keywords||[]).map(k=>`<span class="e ov">${esc(k)}</span>`).join('')}</div>
          <div class="meta">+${esc(w.priority_boost??0)} 权重 · 命中 ${esc(w.hit_count??0)} 条</div></div>`).join(''):'<div class="empty">未配置关注清单</div>')+`</div>`+
        `<div><div class="kg-h">决策记忆（已落 ${me.length}）</div>`+(me.length?me.slice(0,12).map(e=>`
          <div class="pm-wl"><div class="nm">${esc(e.title)}</div>
          <div class="pm-ent">${e.topic?`<span class="e">${esc(e.topic)}</span>`:''}${(e.entities||[]).slice(0,4).map(x=>`<span class="e ov">${esc(x)}</span>`).join('')}</div>
          <div class="meta">urgency ${esc(e.decision?.urgency||'—')} · ${esc(e.decision?.action||'—')}</div></div>`).join('')+(me.length>12?`<div class="pm-caveat">显示前 12 / 共 ${me.length} 条 · 完整见 Personal Memory 页</div>`:''):'<div class="empty">暂无已决事项</div>')+`</div>`+
      `</div>`+
      (gaps.length?`<div class="pm-note">推断缺口 ${gaps.length} 项 — ${esc(blocked?.reason||'推不出的维度已显式记录，未伪造偏好')}。完整见 Personal Memory 页。</div>`:'');
  })().catch(e=>{ setBadge('c-pm','错误'); document.getElementById('pm').innerHTML='<div class="empty">个人记忆层渲染失败：'+esc(e.message)+'。其余模块不受影响。</div>'; });
}
// Second Brain 角色视图
function loadSecondBrain(sb){
  if(!sb){ setBadge('c-sb','不可用'); document.getElementById('sb').innerHTML='<div class="empty">Second Brain 暂不可用（second_brain.json 未生成）。其余模块不受影响。</div>'; return; }
  const order=['strategy','operations','risk'];
  const roles=order.filter(r=>sb.roles&&sb.roles[r]).map(rid=>{
    const r=sb.roles[rid]; const me=r.memory_entries||[];
    const hits=(r.watchlists||[]).reduce((n,w)=>n+(w.hit_count||0),0);
    return `<div class="sb-role">
      <h4>${esc(r.label||rid)}</h4>
      <div class="d">${esc(r.desc||'')}</div>
      <div class="sb-k">关注清单（${esc((r.watchlists||[]).length)}）· 命中 ${esc(hits)}</div>
      <div class="sb-ent">${(r.watchlists||[]).map(w=>`<span class="e">${esc(w.name||w.id)}</span>`).join('')||'<span class="muted">—</span>'}</div>
      <div class="sb-k">高频主题 / 实体</div>
      <div class="sb-ent">${(r.top_topics||[]).slice(0,4).map(t=>`<span class="e">${esc(t.key)}×${esc(t.count)}</span>`).join('')}${(r.top_entities||[]).slice(0,4).map(t=>`<span class="e">${esc(t.key)}×${esc(t.count)}</span>`).join('')}</div>
      <div class="sb-k">决策记忆（${esc(me.length)}）</div>
      <div class="meta">${me.length?me.slice(0,3).map(e=>'· '+esc(e.title.slice(0,30))).join('<br>'):'该角色暂无已落决策'}</div>
    </div>`;
  }).join('');
  setBadge('c-sb', (sb.roles?Object.keys(sb.roles).length:0)+' 角色 / '+(sb.entity_threads?sb.entity_threads.length:0)+' 实体线 / '+(sb.open_questions?sb.open_questions.length:0)+' 开放');
  document.getElementById('sb').innerHTML=roles||'<div class="empty">无角色视图。</div>';
  const oq=sb.open_questions||[];
  if(oq.length){ const n=document.createElement('div'); n.className='pm-caveat'; n.style.gridColumn='1 / -1'; n.innerHTML='开放问题 '+oq.length+' 项已写入 Personal Memory 页 · 原则：'+esc(sb.principle||'只读既有事实，不伪造偏好'); document.getElementById('sb').appendChild(n); }
}
function setBadge(id,n){ const el=document.getElementById(id); if(el) el.textContent=n; }
document.getElementById('refresh').addEventListener('click',render);
render();
</script>

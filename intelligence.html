<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="InsureAI Insurance Intelligence 工作台：趋势雷达、事件情报、证据链与决策支持。">
  <title>InsureAI · Intelligence 工作台</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;color:#172033;background:#f5f7fb;line-height:1.5}
    *{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:0 auto;padding:24px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px}.brand{font-weight:800;font-size:24px}.brand span{color:#f97316}.subtitle{color:#667085;margin:6px 0 0}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:10px;padding:8px 12px;text-decoration:none;font-size:13px}.btn.primary{background:#175cd3;color:#fff;border-color:#175cd3}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 3px 16px rgba(16,24,40,.04)}.kpi{font-size:30px;font-weight:750}.muted{color:#667085;font-size:13px}.kpi-note{margin-top:4px;font-size:12px;color:#98a2b3}
    .section{margin:18px 0}.section-title{font-size:18px;font-weight:720;margin:0 0 14px}.radar{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.trend-list,.entity-list{display:grid;gap:10px}.trend,.entity{border:1px solid #eaecf0;border-radius:12px;padding:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.trend h3,.entity h3{margin:0;font-size:14px}.delta.up{color:#067647}.delta.down{color:#b42318}.delta.stable{color:#667085}.bar{height:8px;background:#eaecf0;border-radius:999px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:#f97316}
    .main{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.event{border:1px solid #e4e7ec;border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer;background:#fff}.event:hover{border-color:#cbd5e1}.event h3{font-size:15px;margin:0 0 8px}.meta{display:flex;flex-wrap:wrap;gap:8px;color:#667085;font-size:12px}.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#f2f4f7}.high{background:#ecfdf3;color:#067647}.review{background:#fff7ed;color:#c2410c}.detail{position:sticky;top:16px;height:max-content}.detail h2{font-size:20px;margin:0 0 12px;line-height:1.4}.empty{color:#667085;padding:40px 0;text-align:center}.meter{height:8px;background:#eaecf0;border-radius:999px;overflow:hidden}.meter>div{height:100%;background:#f97316}.review-box{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412}.signal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.signal{border:1px solid #eaecf0;border-radius:10px;padding:9px}.signal strong{display:block;font-size:14px}.executive{background:#172033;color:#fff;border-radius:14px;padding:18px}.executive .muted{color:#c6cbd4}.executive-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.exec-item{background:rgba(255,255,255,.08);border-radius:10px;padding:12px}.exec-item strong{display:block;font-size:20px;margin-top:4px}
    .dblock{padding:14px 0;border-top:1px solid #eaecf0}.dblock:first-of-type{border-top:0;padding-top:0}.dblock-title{font-size:12px;font-weight:700;color:#344054;letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.dblock-note{font-size:11px;color:#667085;font-weight:400}.what-text{margin:10px 0 0;font-size:14px;line-height:1.6}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:10px}.detail-grid>div>div:last-child{font-size:12px;line-height:1.55}.signal-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.sig{display:flex;flex-direction:column;border:1px solid #eaecf0;border-radius:8px;padding:5px 8px;min-width:86px}.sig .muted{font-size:9px}.sig strong{font-size:14px}
    .vs-badge{font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:6px;white-space:nowrap}.vs-ok{background:#ecfdf3;color:#067647}.vs-warn{background:#fffaeb;color:#b54708}.vs-bad{background:#fef3f2;color:#b42318}.vs-dim{background:#f2f4f7;color:#667085}
    .claim-row{border:1px solid #eaecf0;border-radius:10px;padding:9px 11px;margin-bottom:7px}.claim-row strong{display:block;font-size:12.5px;line-height:1.5;font-weight:600}.claim-row small{display:block;margin-top:5px;font-size:10.5px;color:#667085}.claim-row.conflicted{border-color:#fecdca;background:#fffbfa}
    .tier-badge{font-style:normal;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}.tier-1{background:#dcfce7;color:#15803d}.tier-2{background:#dbeafe;color:#1d4ed8}.tier-3{background:#f1f5f9;color:#64748b}.tier-4{background:#ffedd5;color:#c2410c}
    .ev-row{display:flex;gap:8px;align-items:flex-start;border:1px solid #eaecf0;border-radius:10px;padding:9px 11px;margin-bottom:7px}.ev-main{flex:1;min-width:0}.ev-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.ev-head strong{font-size:12px}.rel{font-style:normal;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}.rel-support{background:#ecfdf3;color:#067647}.rel-contradict{background:#fef3f2;color:#b42318}.rel-context{background:#f2f4f7;color:#667085}.ev-span{display:block;margin-top:5px;font-size:10px;color:#475467;background:#f9fafb;border:1px dashed #eaecf0;border-radius:6px;padding:4px 7px;word-break:break-all}
    .conflict-item{border:1px solid #fecdca;border-radius:10px;padding:10px 11px;margin-bottom:8px;background:#fffbfa}.conflict-claim{font-size:12px;font-weight:600;color:#b42318;margin-bottom:7px}.conflict-sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}.conflict-side{border-radius:8px;padding:7px 9px;font-size:10px}.conflict-side span{display:block;font-weight:700;margin-bottom:3px}.conflict-side code{font-size:10px;word-break:break-all}.side-support{background:#f0fdf4;border:1px solid #abefc6}.side-support span{color:#067647}.side-contradict{background:#fffbfa;border:1px solid #fecdca}.side-contradict span{color:#b42318}
    .dec-item{border:1px solid #eaecf0;border-radius:10px;padding:10px 11px;margin-bottom:7px}.dec-guard{margin-top:6px;font-size:10.5px;color:#9a3412;background:#fff7ed;border-radius:6px;padding:6px 8px;line-height:1.5}.detail-boundary{font-size:11px;color:#667085;border:1px dashed #d0d5dd;border-radius:10px;padding:10px;line-height:1.55}.review-box ul{margin:6px 0 0;padding-left:16px;font-size:11px;line-height:1.6}.fn-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.fn-chip{font-size:9.5px;color:#0f2c44;background:#eef4fa;border:1px solid #d7e5f2;border-radius:4px;padding:1px 6px}.dec-ctx{font-size:10.5px;color:#667085;margin-top:3px}.dec-ctx.opp{color:#1a7f4b}.dec-ctx.risk{color:#b3452e}.dec-next{font-size:10.5px;color:#0f2c44;font-weight:600;margin-top:4px}.role-lens{margin-bottom:8px}.role-chip{display:inline-block;font-size:10px;color:#47546a;background:#f8fafc;border:1px solid #e4e9ef;border-radius:8px;padding:3px 8px;margin:2px 4px 2px 0}.role-chip b{color:#0f2c44;margin-right:4px}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.radar,.main{grid-template-columns:1fr}.detail{position:static}.signal-grid{grid-template-columns:repeat(3,1fr)}.conflict-sides{grid-template-columns:1fr}}
    @media(max-width:600px){.shell{padding:14px}.grid,.executive-grid{grid-template-columns:1fr 1fr}.signal-grid{grid-template-columns:1fr 1fr}.kpi{font-size:24px}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="brand">Insure<span>AI</span> · Intelligence</div><p class="subtitle">从“新闻流”升级为“趋势、事件、证据与决策支持工作台”</p></div>
    <div class="toolbar"><a class="btn primary" href="./">返回主站</a><a class="btn" href="https://github.com/vikings1984/insureai" target="_blank" rel="noopener">GitHub</a></div>
  </header>

  <section class="executive" id="executive-summary"><div class="section-title" style="color:#fff">管理层摘要</div><div class="muted">只看变化、可信度与需要人工判断的事项</div><div class="executive-grid" id="executive-grid"><div class="exec-item">加载中…</div></div></section>

  <section class="grid" id="kpis"><div class="card"><div class="kpi">--</div><div class="muted">加载中</div></div></section>

  <section class="section radar">
    <div class="card"><div class="section-title">Insurance Radar · 主题趋势</div><div id="trends" class="trend-list"><div class="empty">正在加载趋势…</div></div></div>
    <div class="card"><div class="section-title">Entity Radar · 重点主体</div><div id="entities" class="entity-list"><div class="empty">正在加载主体…</div></div></div>
  </section>

  <div class="main">
    <section class="card"><div class="section-title">保险情报事件</div><div class="muted" style="margin-bottom:12px">优先展示高情报价值事件；单一来源、高风险主题默认进入人工复核。</div><div id="events"><div class="empty">正在加载 intelligence.json…</div></div></section>
    <aside class="card detail"><div class="section-title">事件详情</div><div id="detail"><div class="empty">点击左侧事件查看证据和建议</div></div></aside>
  </div>
</div>
<script>
(() => {
  const state = {data:null, reviewQueue:[]};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number.isFinite(Number(n)) ? Number(n).toFixed(0) : '--';
  const pct = n => Math.max(0, Math.min(100, Number(n)||0));
  const directionLabel = d => d==='rising'?'加速':d==='falling'?'回落':'稳定';
  const directionClass = d => d==='rising'?'up':d==='falling'?'down':'stable';

  async function load(){
    try{
      const res = await fetch('intelligence.json?t=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      state.data = await res.json();
      render();
      if(state.data.events?.[0]) show(state.data.events[0]);
    }catch(err){
      document.getElementById('events').innerHTML='<div class="empty">暂无 intelligence.json。请先运行 intelligence.py 生成情报产物。</div>';
      document.getElementById('trends').innerHTML='<div class="empty">暂无趋势数据</div>';
      document.getElementById('entities').innerHTML='<div class="empty">暂无主体数据</div>';
    }
    try{
      const rq = await fetch('review_queue.json?t=' + Date.now(), {cache:'no-store'});
      if(rq.ok) state.reviewQueue = (await rq.json()).items || [];
      if(state.data?.events?.[0]) show(state.data.events[0]);
    }catch(err){ state.reviewQueue = []; }
  }

  function render(){
    const s = state.data.stats || {}, ev = state.data.events || [], radar = state.data.radar || {};
    const reviewCount = s.review_required_events ?? ev.filter(e=>e.review_required).length;
    const multiCount = s.multi_source_events ?? ev.filter(e=>(e.source_count||0)>1).length;
    const rising = (radar.topic_trends||[]).filter(x=>x.direction==='rising');
    const avgCoverage = ev.length ? ev.reduce((a,e)=>a+(Number(e.evidence_coverage)||0),0)/ev.length : 0;

    document.getElementById('executive-grid').innerHTML = [
      ['正在加速', rising.length, rising.length ? '关注趋势形成' : '暂无明显加速主题'],
      ['人工复核', reviewCount, reviewCount ? '优先处理证据不足/高风险事项' : '当前没有复核积压'],
      ['平均证据覆盖', fmt(avgCoverage)+'%', avgCoverage>=80 ? '证据质量较好' : '继续补充独立信源']
    ].map(([title,value,note])=>`<div class="exec-item"><div class="muted">${esc(title)}</div><strong>${esc(value)}</strong><div class="muted">${esc(note)}</div></div>`).join('');

    document.getElementById('kpis').innerHTML = [
      ['情报事件', s.event_count ?? ev.length, 'Event'],
      ['多源事件', multiCount, 'Independent Sources'],
      ['需人工复核', reviewCount, 'Human Review'],
      ['今日简报', (state.data.daily_brief||[]).length, 'Daily Brief']
    ].map(([a,b,c])=>`<div class="card"><div class="kpi">${esc(b)}</div><div class="muted">${esc(a)}</div><div class="kpi-note">${esc(c)}</div></div>`).join('');

    document.getElementById('trends').innerHTML = (radar.topic_trends||[]).slice(0,8).map(t=>`<div class="trend"><div class="row"><h3>${esc(t.topic_label||t.topic)}</h3><span class="delta ${directionClass(t.direction)}">${esc(directionLabel(t.direction))} · ${esc(t.confidence||'low')}</span></div><div class="muted" style="margin-top:5px">7日 ${esc(t.current_7d_events)} 件 · 前7日 ${esc(t.previous_7d_events)} 件 · 信号 ${esc(t.strength)}</div><div class="bar"><div style="width:${pct(t.strength)}%"></div></div></div>`).join('') || '<div class="empty">暂无趋势</div>';

    document.getElementById('entities').innerHTML = (radar.entity_radar||[]).slice(0,8).map(x=>`<div class="entity"><div class="row"><h3>${esc(x.display_name||x.entity)}</h3><span class="pill">${esc(x.confidence||'low')}</span></div><div class="muted" style="margin-top:5px">7日 ${esc(x.event_count_7d)} 件 · 30日 ${esc(x.event_count_30d)} 件 · 活跃度 ${esc(x.weighted_activity)}</div><div class="kpi-note">${esc(x.latest_event||'暂无')}</div></div>`).join('') || '<div class="empty">暂无主体</div>';

    document.getElementById('events').innerHTML = ev.slice(0,30).map((e,i)=>{
      const score = e.scores?.intelligence_score ?? 0;
      const coverage = e.evidence_coverage ?? e.insight?.evidence_coverage ?? 0;
      const review = e.review_required || e.insight?.human_review_required;
      const trust = e.trust?.level || 'low';
      const conflicted = (e.claims||{}).conflicted || 0;
      return `<div class="event" data-i="${i}"><h3>${esc(e.title)}</h3><div class="meta"><span class="pill">${esc(e.topic_label||'保险行业')}</span><span class="pill">${esc(e.event_type||'industry_update')}</span><span class="pill">情报 ${fmt(score)}</span><span class="pill">可信度 ${esc(trust)}</span>${conflicted?`<span class="pill review">命题冲突 ${esc(conflicted)}</span>`:''}<span class="pill ${review?'review':'high'}">${review?'需人工复核':'证据充分'}</span></div><div class="muted" style="margin-top:8px">证据覆盖 ${fmt(coverage)}% · ${esc(e.source_count||0)} 个信源</div></div>`;
    }).join('') || '<div class="empty">暂无事件</div>';
    document.querySelectorAll('.event').forEach(el => el.addEventListener('click', () => show(ev[Number(el.dataset.i)])));
  }

  /* detail-renderer:start — UI 契约（tests/test_event_detail_ui.py 锁定）：
     本函数渲染的全部字段只来自 intelligence.json 与 review_queue.json，禁止引入 artifact 之外的事实。 */
  const CLAIM_STATUS = {cross_checked:['已交叉验证','vs-ok'], single_source:['单一来源','vs-warn'], conflicted:['证据冲突','vs-bad'], unverified:['待验证','vs-dim']};
  const TIER_LABEL = {1:'T1 一手',2:'T2 通讯社',3:'T3 行业',4:'T4 社交'};
  const RELATION_LABEL = {support:'支持', contradict:'矛盾', context:'关联'};
  const RELATION_RANK = {contradict:2, support:1, context:0};
    const ROLE_LABELS = {executive:'高管',product:'产品',underwriting:'核保',actuarial:'精算',investment:'投资',technology:'技术',claims:'理赔',distribution:'渠道'};

  function show(e){
    const insight = e.insight || {}, trust = e.trust || {}, claimsBox = e.claims || {};
    const claims = Array.isArray(claimsBox.claims) ? claimsBox.claims : [];
    const decisions = (state.data.decisions || []).filter(d => d.event_id === e.event_id);
    const reviewItem = (state.reviewQueue || []).filter(r => r.event_id === e.event_id)[0] || null;
    const signalScores = (insight.signals || {}).scores || {};
    const coverage = e.evidence_coverage ?? insight.evidence_coverage ?? 0;

    const byKey = new Map();
    const addEvidence = (row, relation) => {
      if(!row) return;
      const key = String(row.evidence_id || row.source_url || row.source_name || '');
      const prev = byKey.get(key);
      if(prev){
        if((RELATION_RANK[relation] || 0) > (RELATION_RANK[prev.relation] || 0)) prev.relation = relation;
        if(row.matched_span && prev.spans.indexOf(row.matched_span) < 0) prev.spans.push(row.matched_span);
      }else{
        byKey.set(key, {source_name: row.source_name, source_url: row.source_url, source_tier: row.source_tier, published_at: row.published_at, relation, spans: row.matched_span ? [row.matched_span] : []});
      }
    };
    claims.forEach(cl => {
      (cl.supporting_evidence || []).forEach(r => addEvidence(r, 'support'));
      (cl.contradicting_evidence || []).forEach(r => addEvidence(r, 'contradict'));
      (cl.context_evidence || []).forEach(r => addEvidence(r, 'context'));
    });
    let evidenceRows = [...byKey.values()];
    if(!evidenceRows.length){
      const rows = (Array.isArray(trust.evidence) && trust.evidence.length) ? trust.evidence : (e.evidence || insight.evidence || []);
      evidenceRows = rows.map(x => ({source_name: x.source_name, source_url: x.source_url, source_tier: x.source_tier, published_at: x.published_at, relation: '', spans: []}));
    }

    const conflictedClaims = claims.filter(cl => (cl.contradicting_evidence || []).length > 0);

    const claimHtml = claims.length ? claims.map(cl => {
      const status = cl.verification_status || 'unverified';
      const badge = CLAIM_STATUS[status] || [status, 'vs-dim'];
      const contra = (cl.contradicting_evidence || []).length, ctx = (cl.context_evidence || []).length;
      return `<div class="claim-row${status==='conflicted'?' conflicted':''}"><strong>${esc(cl.claim_text)}</strong><small><i class="vs-badge ${badge[1]}">${esc(badge[0])}</i>置信 ${fmt(cl.confidence)} · 支持 ${esc(cl.evidence_count||0)}${contra?` · 矛盾 ${esc(contra)}`:''}${ctx?` · 关联 ${esc(ctx)}`:''} · ${esc(cl.independent_domains||0)} 个独立域</small></div>`;
    }).join('') : '<div class="muted">该事件暂无可拆分的事实命题。</div>';

    const evidenceHtml = evidenceRows.length ? evidenceRows.map(x => {
      const tier = x.source_tier || 0;
      const tierBadge = TIER_LABEL[tier] ? `<i class="tier-badge tier-${esc(tier)}">${esc(TIER_LABEL[tier])}</i>` : '';
      const rel = x.relation && RELATION_LABEL[x.relation] ? `<i class="rel rel-${esc(x.relation)}">${esc(RELATION_LABEL[x.relation])}</i>` : '';
      return `<div class="ev-row">${tierBadge}<div class="ev-main"><div class="ev-head"><strong>${esc(x.source_name||'来源')}</strong>${rel}</div>${x.spans.length?`<code class="ev-span">${x.spans.map(s=>esc(s)).join(' / ')}</code>`:''}<div class="muted">${esc(x.published_at||'')}${x.source_url?` · <a href="${esc(x.source_url)}" target="_blank" rel="noopener">打开原文</a>`:''}</div></div></div>`;
    }).join('') : '<div class="muted">暂无可追溯证据。</div>';

    const conflictHtml = conflictedClaims.length ? conflictedClaims.map(cl => {
      const sup = (cl.supporting_evidence || [])[0] || {};
      const con = (cl.contradicting_evidence || [])[0] || {};
      return `<div class="conflict-item"><div class="conflict-claim">${esc(cl.claim_text)}</div><div class="conflict-sides"><div class="conflict-side side-support"><span>支持 · ${esc(sup.source_name||'')}</span><code>${esc(sup.matched_span||'')}</code></div><div class="conflict-side side-contradict"><span>矛盾 · ${esc(con.source_name||'')}</span><code>${esc(con.matched_span||'')}</code></div></div></div>`;
    }).join('') + (trust.conflict ? `<div class="muted">Trust 层亦检出冲突字段：${esc((trust.conflict_fields||[]).join('、')||'-')}</div>` : '') : '<div class="muted">未检测到支持/矛盾证据冲突。</div>';

    const byRole = state.data.decisions_by_role || {};
    const roleLensHtml = Object.keys(byRole).map(role => { const hit = (byRole[role]||[]).filter(d => d.event_id === e.event_id); return hit.length ? `<span class="role-chip"><b>${esc(ROLE_LABELS[role]||role)}</b>${esc(hit[0].action)}</span>` : ''; }).join('');
    const decisionHtml = decisions.length ? decisions.map(d => { const ctx = d.context || {}; const fns = (ctx.affected_functions||[]).map(f=>`<span class="fn-chip">${esc(f.label)} ${esc(f.impact||0)}</span>`).join(''); const opp = (ctx.potential_opportunity||[]).join('；'); const risk = (ctx.potential_risk||[]).join('；'); return `<div class="dec-item"><div class="row"><strong>${esc(d.action)}</strong><span class="pill ${d.urgency==='now'?'review':'high'}">${esc(d.urgency_label||d.urgency)}</span></div><div class="muted" style="margin-top:4px">依据：可信度 ${esc((d.basis||{}).trust_level||'-')} · 证据 ${esc((d.basis||{}).evidence_status||'-')} · 趋势 ${esc((d.basis||{}).temporal_phase||'-')}</div>${fns?`<div class="fn-row">${fns}</div>`:''}${opp?`<div class="dec-ctx opp">机会：${esc(opp)}</div>`:''}${risk?`<div class="dec-ctx risk">风险：${esc(risk)}</div>`:''}${ctx.what_to_monitor?`<div class="dec-ctx">监控：${esc(ctx.what_to_monitor)}</div>`:''}${ctx.recommended_next_step?`<div class="dec-next">下一步：${esc(ctx.recommended_next_step)}</div>`:''}${d.guardrail?`<div class="dec-guard">${esc(d.guardrail)}</div>`:''}</div>`; }).join('') : '<div class="muted">该事件未进入决策队列。</div>';
    const watchHtml = insight.what_to_watch ? `<div class="detail-boundary" style="margin-top:8px">接下来关注：${esc(insight.what_to_watch)}</div>` : '';

    const reviewHtml = reviewItem ? `<div class="review-box"><strong>Human Review Required · 优先级 ${esc(reviewItem.priority)}</strong><div class="muted" style="margin-top:4px">复核状态：${esc(reviewItem.status||'pending')}</div><ul>${(reviewItem.reasons||[]).map(r=>`<li>${esc(r.reason)}</li>`).join('')}</ul></div>` : ((e.review_required || insight.human_review_required) ? '<div class="review-box"><strong>Human Review Required</strong><div style="margin-top:4px">该事件证据覆盖不足或属于高风险主题，需人工复核后才能作为业务依据。</div></div>' : '<div class="detail-boundary">该事件当前无需人工复核。AI 输出仅为 advisory，不替代承保、投资、合规或经营决策。</div>');

    document.getElementById('detail').innerHTML = `
      <section class="dblock" data-detail-block="what-happened">
        <h2>${esc(e.title)}</h2>
        <div class="meta"><span class="pill">${esc(e.topic_label||'保险行业')}</span><span class="pill">${esc(e.event_type||'industry_update')}</span><span class="pill">可信度 ${esc(trust.level||'low')}</span><span class="pill">证据 ${esc(e.evidence_status||'unknown')}</span></div>
        <p class="what-text">${esc(insight.what_happened||e.title)}</p>
        <div class="detail-grid"><div><div class="muted">为什么重要</div><div>${esc(insight.why_it_matters||'暂无')}</div></div><div><div class="muted">影响谁</div><div>${esc(insight.who_is_affected||'暂无')}</div></div></div>
        <div class="signal-strip">${['strategic_change','regulatory_change','market_change','technology_change','financial_impact'].map(k=>`<div class="sig"><span class="muted">${esc(k)}</span><strong>${fmt(signalScores[k])}</strong></div>`).join('')}</div>
      </section>
      <section class="dblock" data-detail-block="claims">
        <div class="dblock-title">关键命题<span class="dblock-note">覆盖 ${esc(claimsBox.coverage||0)}% · 交叉验证 ${esc(claimsBox.cross_checked||0)} · 冲突 ${esc(claimsBox.conflicted||0)}</span></div>
        ${claimHtml}
      </section>
      <section class="dblock" data-detail-block="evidence">
        <div class="dblock-title">证据<span class="dblock-note">覆盖 ${fmt(coverage)}% · ${esc(e.source_count||0)} 个信源 · ${esc(trust.independent_domains||0)} 个独立域</span></div>
        <div class="meter" style="margin-bottom:8px"><div style="width:${pct(coverage)}%"></div></div>
        ${evidenceHtml}
      </section>
      <section class="dblock" data-detail-block="conflicts">
        <div class="dblock-title">冲突证据</div>
        ${conflictHtml}
      </section>
      <section class="dblock" data-detail-block="recommendation">
        <div class="dblock-title">建议<span class="dblock-note">${esc(decisions.length)} 条决策建议</span></div>
        ${roleLensHtml?`<div class="role-lens"><div class="muted" style="margin-bottom:4px">角色视角（数据同源、视角不同）</div>${roleLensHtml}</div>`:''}
        ${decisionHtml}${watchHtml}
      </section>
      <section class="dblock" data-detail-block="review">
        <div class="dblock-title">Human Review 状态</div>
        ${reviewHtml}
      </section>`;
  }
  /* detail-renderer:end */
  load();
})();
</script>
</body>
</html>

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [insureai]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-workers-deploy
  # Do not cancel an in-flight deployment when a second data/quality commit arrives.
  # Static asset deployment is intentionally serialized so release verification cannot
  # be interrupted by the next commit.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject deployment identity marker
        run: python3 scripts/inject_ui_assets.py

      - name: Deploy static assets to Workers
        # secrets 未配置时跳过（env 变量为空，job 显示成功而非失败）；配置后自动启用。
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 4 才支持纯静态资产（无 main 入口）的部署
          wranglerVersion: '4.125.0'
          command: deploy

      - name: Verify deployment artifact marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'insureai-release-marker' in text, 'deployment marker was not injected'
          assert 'InsureAI' in text, 'InsureAI site identity missing from deployment artifact'
          print('Cloudflare deployment artifact identity verified')
          PY

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'InsureAI Cloudflare 部署失败';
            const body = `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [insureai]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  issues: write
  actions: read

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: false

jobs:
  # 质量门禁（P0-2 修复）：deploy 与 test/benchmark 是三个独立 workflow，
  # needs: 无法跨文件生效，因此用本 job 轮询同 SHA 的 InsureAI Tests /
  # InsureAI Benchmark 运行状态，任一失败或超时未结束则阻断部署（fail-closed）。
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require Tests + Benchmark green for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, sys, json, time, subprocess
          sha = os.environ['SHA']; repo = os.environ['REPO']
          needed = {'InsureAI Tests': None, 'InsureAI Benchmark': None}
          deadline = time.time() + 12 * 60  # 最多等待 12 分钟
          while time.time() < deadline:
              out = subprocess.run(
                  ['gh', 'api', f'repos/{repo}/actions/runs?head_sha={sha}&per_page=100'],
                  capture_output=True, text=True)
              if out.returncode != 0:
                  print('gh api error:', out.stderr.strip()); sys.exit(1)
              for r in json.loads(out.stdout).get('workflow_runs', []):
                  name = r.get('name')
                  if name in needed and r.get('status') == 'completed':
                      needed[name] = (r.get('conclusion') == 'success')
              if all(v is not None for v in needed.values()):
                  break
              time.sleep(20)
          print('gate status:', needed)
          if any(v is False for v in needed.values()):
              print('QUALITY GATE FAILED — blocking deploy'); sys.exit(1)
          if any(v is None for v in needed.values()):
              print('QUALITY GATE TIMEOUT — not all required runs completed; blocking deploy (fail-closed)'); sys.exit(1)
          print('QUALITY GATE PASSED')
          PY

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Inject deployment identity marker
        run: python3 scripts/inject_ui_assets.py

      - name: Deploy static assets to Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: deploy

      - name: Verify deployment artifact marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'insureai-release-marker' in text, 'deployment marker was not injected'
          assert 'InsureAI' in text, 'InsureAI site identity missing from deployment artifact'
          print('Cloudflare deployment artifact identity verified')
          PY

      - name: Verify live deployment
        if: env.DEPLOYMENT_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Live deployment verification attempt ${attempt}/5"
            if python3 deployment_verification.py; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Detect deployment state transition
        id: transition
        if: always() && env.DEPLOYMENT_URL != ''
        run: |
          output="$(python3 scripts/deployment_state_transition.py)"
          echo "$output"
          echo "state_changed=${output##*=}" >> "$GITHUB_OUTPUT"

      - name: Bridge verification into release provenance
        if: always() && env.DEPLOYMENT_URL != '' && steps.transition.outputs.state_changed == 'true'
        run: |
          if [ -f release_provenance.json ] && [ -f deployment_verification.json ]; then
            python3 -c "from release_provenance import attach_deployment_verification; attach_deployment_verification(); print('Release provenance updated')"
          else
            echo 'Provenance bridge skipped: optional artifact missing'
          fi

      - name: Commit deployment verification state
        if: always() && env.DEPLOYMENT_URL != '' && steps.transition.outputs.state_changed == 'true'
        run: |
          git config user.name "insureai-bot"
          git config user.email "bot@insureai.local"
          files="deployment_verification.json deployment_verification_history.json"
          [ -f release_provenance.json ] && files="$files release_provenance.json"
          if [ -n "$(git status --porcelain $files)" ]; then
            git add $files
            # Discard regenerable deploy artifacts (index.html marker etc.) so
            # rebase can run on a clean tree without unstaged changes.
            git checkout -- . 2>/dev/null || true
            git commit -m "chore: record deployment verification [skip ci]" || echo 'nothing to commit'
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:${{ github.ref_name }}
            else
              echo 'Remote already advanced with concurrent verification state; discarding local commit'
              git rebase --abort
              git reset --merge
            fi
          else
            echo 'No deployment verification state changes to commit'
          fi

      - name: Report verification configuration
        if: env.DEPLOYMENT_URL == ''
        run: "echo 'Deployment verification is unconfigured: set the repository Actions variable DEPLOYMENT_URL.'"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'InsureAI Cloudflare 部署失败';
            const body = `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

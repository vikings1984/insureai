name: InsureAI Benchmark

on:
  push:
    branches: [insureai]
  pull_request:
    branches: [insureai]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Benchmark syntax check
        run: python3 -m py_compile benchmark.py real_data_benchmark.py resolution_benchmark.py semantic_change_benchmark.py decision_funnel.py identity_resolver.py tests/test_benchmark.py tests/test_real_data_benchmark_v2.py tests/test_resolution_benchmark.py tests/test_semantic_change_benchmark.py tests/test_decision_funnel_gold.py tests/test_identity_resolver_canonical_schema.py scripts/sample_real_v2_candidates.py scripts/promote_real_v2_candidates.py
      - name: Run core intelligence benchmark
        run: python3 benchmark.py
      - name: Run P1-4 real-data annotation benchmark
        run: python3 real_data_benchmark.py
      - name: Run P1-4.1 real-data annotation benchmark (v2.0 difficult samples)
        run: python3 real_data_benchmark.py --articles benchmarks/real_v2/articles.json --gold benchmarks/real_v2/gold.json --out real_benchmark_v2_results.json
      # ===== 第六阶段 P0-4：三个业务精度 benchmark 正式进入 CI =====
      # 此前这些 benchmark 只在本地/推送时运行，CI 不执行（评审「未收口」项）。
      # 纪律：seed gold 阶段**只报告、不阻断**（不进 safety 硬门），待 gold_status=human_confirmed 后再议。
      - name: Run P0-1 canonical resolution accuracy benchmark
        if: always()
        run: python3 resolution_benchmark.py
      - name: Run P0-2 semantic change precision benchmark
        if: always()
        run: python3 semantic_change_benchmark.py
      - name: Publish stage-6 precision benchmark summary
        if: always()
        run: |
          if [ -f benchmark_results.json ]; then
            python3 -c "import json; f=json.load(open('benchmark_results.json', encoding='utf-8')).get('funnel',{}); print('decision_ready_count=' + str(f.get('decision_ready_count'))); print('structural_precision=' + str(f.get('decision_ready_precision'))); print('gold_precision=' + str(f.get('gold_precision'))); print('gold_status=' + str(f.get('gold_status')))"
          fi
      - name: Run benchmark regression tests
        run: python3 -m unittest tests.test_benchmark -v
      - name: Run P1-4.1 benchmark regression tests
        run: python3 -m unittest tests.test_real_data_benchmark_v2 -v
      - name: Run P1-4.1 expanded real-data set (if human-promoted)
        if: always()
        run: |
          if [ -f benchmarks/real_v2/gold_real.json ]; then
            python3 real_data_benchmark.py --articles benchmarks/real_v2/articles_real.json --gold benchmarks/real_v2/gold_real.json --out real_benchmark_v2_real_results.json
            python3 -c "import json; r=json.load(open('real_benchmark_v2_real_results.json', encoding='utf-8')); print('real_expanded_macro_quality=' + str(r.get('macro_quality'))); print('real_expanded_false_merge_rate=' + str(r.get('event',{}).get('false_merge_rate'))); print('real_expanded_false_split_rate=' + str(r.get('event',{}).get('false_split_rate'))); print('real_expanded_single_source_false_cross_check_rate=' + str(r.get('claim_evidence',{}).get('single_source_false_cross_check_rate')))"
          else
            echo "no human-promoted real set yet (run: python3 scripts/promote_real_v2_candidates.py apply)"
          fi
      - name: Publish benchmark result summary
        if: always()
        run: |
          if [ -f benchmark_results.json ]; then
            python3 -c "import json; r=json.load(open('benchmark_results.json', encoding='utf-8')); print('macro_quality=' + str(r.get('macro_quality'))); print('safety_pass=' + str(r.get('safety_pass'))); print('event_false_merge_rate=' + str(r.get('event',{}).get('false_merge_rate'))); print('event_false_split_rate=' + str(r.get('split',{}).get('false_split_rate'))); print('single_source_false_cross_check_rate=' + str(r.get('claim_evidence',{}).get('single_source_false_cross_check_rate'))); print('unsafe_now_rate=' + str(r.get('decision',{}).get('unsafe_now_rate')))"
          fi
          if [ -f real_benchmark_results.json ]; then
            python3 -c "import json; r=json.load(open('real_benchmark_results.json', encoding='utf-8')); print('real_macro_quality=' + str(r.get('macro_quality'))); print('real_event_false_merge_rate=' + str(r.get('event',{}).get('false_merge_rate'))); print('real_event_false_split_rate=' + str(r.get('event',{}).get('false_split_rate'))); print('real_single_source_false_cross_check_rate=' + str(r.get('claim_evidence',{}).get('single_source_false_cross_check_rate'))); print('real_claim_accuracy=' + str(r.get('claim_evidence',{}).get('accuracy')))"
          fi
          if [ -f real_benchmark_v2_results.json ]; then
            python3 -c "import json; r=json.load(open('real_benchmark_v2_results.json', encoding='utf-8')); print('real_v2_macro_quality=' + str(r.get('macro_quality'))); print('real_v2_event_false_merge_rate=' + str(r.get('event',{}).get('false_merge_rate'))); print('real_v2_event_false_split_rate=' + str(r.get('event',{}).get('false_split_rate'))); print('real_v2_single_source_false_cross_check_rate=' + str(r.get('claim_evidence',{}).get('single_source_false_cross_check_rate'))); print('real_v2_dimension_coverage=' + str(r.get('dimension_coverage')))"
          fi

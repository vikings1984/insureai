name: InsureAI Tests

on:
  pull_request:
    branches: [insureai]
  push:
    branches: [insureai]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python3 -m py_compile intelligence.py radar.py personalization.py trust.py trust_build.py scripts/inject_intelligence_ui.py scripts/inject_personalization_ui.py
      - name: JavaScript syntax check
        run: node --check behavior_learning.js && node --check personalization-ui.js
      - name: Unit tests
        run: python3 -m unittest discover tests/ -v

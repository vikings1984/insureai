name: InsureAI Tests
on:
  pull_request:
    branches: [insureai]
  push:
    branches: [insureai]
  # 必须显式声明：daily-collect 用 `gh workflow run test.yml` 派发本工作流（见
  # daily-collect.yml 的 "Dispatch downstream tests + deploys after data publish"）。
  # 缺此项时 gh 派发会失败、且因 `&& echo` 写法被静默吞掉，表现为：
  # 整包发布提交（只含 *.json/index.html，不含源码）不触发 push 上的 Tests 运行
  # -> deploy-cloudflare 的同 SHA 门禁永远等不到 Tests 结论 -> 轮询 12 分钟后
  # QUALITY GATE TIMEOUT，Workers 部署被 fail-closed 拦红（2026-10-01 实测 2938fa1）。
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Daily collect workflow contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/daily-collect.yml').read_text(encoding='utf-8')
          required = [
              'name: Build final analytical audit ledger',
              'run: python3 audit_ledger.py',
              'name: Validate final analytical audit ledger',
              'missing audit artifacts',
              'name: Build executive intelligence terminal',
              'python3 executive_terminal.py',
              'name: Build P2 daily intelligence brief',
              'run: python3 p2_intelligence.py',
              'name: Validate P2 daily intelligence brief',
          ]
          for marker in required:
              assert marker in text, f'missing workflow contract marker: {marker}'
          # P1-7 DAG 重构后，`Build owner-facing risk view` 等节点已迁入 dag.py 声明，
          # 不再是 daily-collect.yml 的独立 step name；此处改为断言「DAG 步骤存在 +
          # audit ledger 紧随其后」，保持原语义（审计台账必须晚于各产物生产步骤）。
          assert 'run: python3 dag.py run' in text, 'daily-collect 必须先跑 DAG（dag.py run）'
          assert text.index('Build intelligence analytics (DAG)') < text.index('Build final analytical audit ledger')
          # P0-3 后整包发布取代了旧的单文件提交步骤，契约断言随之对齐新步骤名
          # （语义不变：审计台账必须先于最终提交）。
          assert text.index('Build final analytical audit ledger') < text.index('Commit atomic release bundle')
          # P2 must run after the terminal and before the ledger so its artifact is audited.
          assert text.index('Build P2 daily intelligence brief') < text.index('Build final analytical audit ledger')
          print('Daily collect workflow contract valid')
          PY
      - name: Syntax check
        run: python3 -m py_compile gold_ce_bridge.py resolution_benchmark.py scripts/gold_incremental.py decision_outcome.py review_decision_engine.py source_os.py review_feedback.py review_threshold_calibration.py scripts/review_feedback_capture.py scripts/decision_outcome_capture.py contract.py evaluation.py evaluation_metrics.py production_replay.py calibration.py counterfactual.py scenario.py scenario_evidence.py scenario_matrix.py action_triggers.py execution_readiness.py audit_ledger.py change_impact.py feedback_attribution.py module_health.py module_health_trend.py optimization_backlog.py optimization_fix_verification.py freshness.py evidence_availability.py review.py promote_reviews.py intelligence.py intelligence_signal.py radar.py personalization.py trust.py trust_build.py claims.py claims_build.py source_tiers.py temporal.py temporal_build.py trend_intelligence.py decision.py decision_build.py kg_query.py knowledge_graph.py release_manifest.py release_provenance.py production_quality_gate.py deployment_verification.py deployment_risk.py deployment_trend.py decision_stability.py decision_credibility.py daily_risk_radar.py owner_risk_view.py executive_terminal.py p2_intelligence.py p2_import_feedback.py run.py atomic_publish.py scripts/verify_full_pipeline.py scripts/validate_data.py scripts/inject_ui_assets.py scripts/quality_score.py
      - name: JavaScript syntax check
        run: node --check behavior_learning.js && node --check intelligence-ui.js && node --check personalization-ui.js && node --check trust-ui.js && node --check claim-evidence-ui.js && node --check temporal-ui.js && node --check decision-ui.js && node --check review-ui.js && node --check action-triggers-ui.js && node --check execution-readiness-ui.js && node --check owner-risk-ui.js
      - name: Contract check
        run: python3 -m unittest tests.test_contract -v
      - name: Intelligence evaluation gate
        run: python3 evaluation.py
      - name: Quantitative quality metrics gate
        run: python3 -c "from evaluation_metrics import build_metrics; m=build_metrics(); assert m['macro_quality'] >= 0.95, m; assert m['production']['claim_evidence_match_rate'] >= 0.6, m; print(m)"
      - name: Production replay
        run: python3 production_replay.py
      - name: Calibration test
        run: python3 -m unittest tests.test_calibration -v
      - name: Counterfactual robustness test
        run: python3 -m unittest tests.test_counterfactual tests.test_counterfactual_review -v
      - name: Scenario intelligence test
        run: python3 -m unittest tests.test_scenario -v
      - name: Scenario evidence vulnerability test
        run: python3 -m unittest tests.test_scenario_evidence -v
      - name: Scenario decision matrix test
        run: python3 -m unittest tests.test_scenario_matrix -v
      - name: Robust action confidence test
        run: python3 -m unittest tests.test_robust_action_confidence -v
      - name: Release manifest test
        run: python3 -m unittest tests.test_release_manifest -v
      - name: Production quality gate test
        run: python3 -m unittest tests.test_production_quality_gate -v
      - name: Decision stability test
        run: python3 -m unittest tests.test_decision_stability -v
      - name: Decision credibility test
        run: python3 -m unittest tests.test_decision_credibility -v
      - name: Decision context test
        run: python3 -m unittest tests.test_decision_context -v
      - name: Daily risk radar test
        run: python3 -m unittest tests.test_daily_risk_radar -v
      - name: Deployment risk test
        run: python3 -m unittest tests.test_deployment_risk -v
      - name: Deployment trend test
        run: python3 -m unittest tests.test_deployment_trend -v
      - name: Owner risk view test
        run: python3 -m unittest tests.test_owner_risk_view -v
      - name: Action trigger test
        run: python3 -m unittest tests.test_action_triggers -v
      - name: Execution readiness test
        run: python3 -m unittest tests.test_execution_readiness -v
      - name: Audit ledger test
        run: python3 -m unittest tests.test_audit_ledger -v
      - name: Change impact test
        run: python3 -m unittest tests.test_change_impact -v
      - name: Feedback attribution test
        run: python3 -m unittest tests.test_feedback_attribution -v
      - name: Module health test
        run: python3 -m unittest tests.test_module_health -v
      - name: Knowledge graph build and query test
        run: python3 -m unittest tests.test_knowledge_graph tests.test_kg_query -v
      - name: Module health trend test
        run: python3 -m unittest tests.test_module_health_trend -v
      - name: Optimization backlog test
        run: python3 -m unittest tests.test_optimization_backlog tests.test_optimization_backlog_lifecycle tests.test_optimization_fix_verification -v
      - name: Freshness quality test
        run: python3 -m unittest tests.test_freshness tests.test_evidence_availability -v
      - name: Human review queue test
        run: python3 -m unittest tests.test_review tests.test_promote_reviews -v
      - name: E3 feedback import + site page + X1 convergence contract test
        run: python3 -m unittest tests.test_p2_import_feedback tests.test_site_pages tests.test_x1_convergence tests.test_canonical_annotations -v
      - name: Validate committed p2_state feedback schema
        run: |
          python3 - <<'PY'
          import json
          from p2_import_feedback import validate_feedback_row, validate_monitor_row
          state = json.load(open('p2_state.json'))
          ids = {w.get('id') for w in state.get('watchlists', []) if w.get('id')}
          bad = []
          for row in state.get('feedback', []):
              if validate_feedback_row(row):
                  bad.append(('feedback', row))
          for row in state.get('monitoring', []):
              if validate_monitor_row(row, ids):
                  bad.append(('monitoring', row))
          assert not bad, f'p2_state.json 存在非法反馈行：{bad}'
          fb = len(state.get('feedback', [])); mon = len(state.get('monitoring', []))
          print(f"p2_state feedback valid: {fb} feedback / {mon} monitoring")
          PY
      - name: Deployment verification test
        run: python3 -m unittest tests.test_deployment_verification -v
      - name: Executive terminal test
        run: python3 -m unittest tests.test_executive_terminal -v
      - name: Unit tests
        run: python3 -m unittest discover tests/ -v
      - name: Full production pipeline smoke
        env:
          SITE_URL: https://vikings1984.github.io/insureai
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/verify_full_pipeline.py --collect-limit 3
      # 血缘门禁必须排在完整管线之后：release bundle 的 lineage 校验要求
      # data.json 与 intelligence.json 处于同一构建快照。而 collect 与 analyze
      # 是两个独立 job、分时提交——push 触发时若先跑 verify，读到的 intelligence.json
      # 必然落后于 data.json（2026-09-30 实测落后 652 篇文章），lineage 恒失败。
      # 移到管线跑完后，校验的是本轮刚构建的产物：门禁保持严格，不做任何削弱。
      - name: Atomic publish bundle verify (read-only)
        run: python3 atomic_publish.py verify

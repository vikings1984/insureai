name: InsureAI Tests
on:
  pull_request:
    branches: [insureai]
  push:
    branches: [insureai]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python3 -m py_compile contract.py evaluation.py evaluation_metrics.py production_replay.py calibration.py counterfactual.py scenario.py scenario_matrix.py action_triggers.py execution_readiness.py audit_ledger.py change_impact.py feedback_attribution.py module_health.py module_health_trend.py optimization_backlog.py review.py promote_reviews.py intelligence.py radar.py personalization.py trust.py trust_build.py claims.py temporal.py temporal_build.py decision.py decision_build.py scripts/inject_intelligence_ui.py scripts/inject_personalization_ui.py scripts/inject_trust_ui.py scripts/inject_claim_evidence_ui.py scripts/inject_temporal_ui.py scripts/inject_decision_ui.py scripts/inject_review_ui.py scripts/inject_action_triggers_ui.py scripts/inject_execution_readiness_ui.py
      - name: JavaScript syntax check
        run: node --check behavior_learning.js && node --check personalization-ui.js && node --check trust-ui.js && node --check claim-evidence-ui.js && node --check temporal-ui.js && node --check decision-ui.js && node --check review-ui.js && node --check action-triggers-ui.js && node --check execution-readiness-ui.js
      - name: Contract check
        run: python3 -m unittest tests.test_contract -v
      - name: Intelligence evaluation gate
        run: python3 evaluation.py
      - name: Quantitative quality metrics gate
        run: python3 -c "from evaluation_metrics import build_metrics; m=build_metrics(); assert m['macro_quality'] >= 0.95, m; print(m)"
      - name: Production replay
        run: python3 production_replay.py
      - name: Calibration test
        run: python3 -m unittest tests.test_calibration -v
      - name: Counterfactual robustness test
        run: python3 -m unittest tests.test_counterfactual tests.test_counterfactual_review -v
      - name: Scenario intelligence test
        run: python3 -m unittest tests.test_scenario -v
      - name: Scenario decision matrix test
        run: python3 -m unittest tests.test_scenario_matrix -v
      - name: Action trigger test
        run: python3 -m unittest tests.test_action_triggers -v
      - name: Execution readiness test
        run: python3 -m unittest tests.test_execution_readiness -v
      - name: Audit ledger test
        run: python3 -m unittest tests.test_audit_ledger -v
      - name: Change impact test
        run: python3 -m unittest tests.test_change_impact -v
      - name: Feedback attribution test
        run: python3 -m unittest tests.test_feedback_attribution -v
      - name: Module health test
        run: python3 -m unittest tests.test_module_health -v
      - name: Module health trend test
        run: python3 -m unittest tests.test_module_health_trend -v
      - name: Optimization backlog test
        run: python3 -m unittest tests.test_optimization_backlog -v
      - name: Human review queue test
        run: python3 -m unittest tests.test_review tests.test_promote_reviews -v
      - name: Unit tests
        run: python3 -m unittest discover tests/ -v

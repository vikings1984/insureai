name: InsureAI Intelligence Contract

on:
  pull_request:
    branches: [insureai]
  push:
    branches: [insureai]

permissions:
  contents: read

jobs:
  intelligence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Syntax check canonical intelligence modules
        run: python3 -m py_compile intelligence_signal.py intelligence.py claims.py claims_build.py decision.py
      - name: Validate schema files are valid JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('schemas').glob('*.schema.json')):
              with path.open(encoding='utf-8') as f:
                  doc = json.load(f)
              assert doc.get('$schema'), f'missing $schema: {path}'
              assert doc.get('title'), f'missing title: {path}'
              assert doc.get('type') == 'object', f'expected object schema: {path}'
          print('Schema contracts valid')
          PY
      - name: Generate canonical intelligence artifact
        run: python3 intelligence.py
      - name: Generate and validate claim/evidence artifact
        run: |
          python3 claims_build.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from contract import ARTIFACT_VERSIONS
          allowed = {'single_source', 'cross_checked', 'conflicted', 'unverified'}
          data = json.loads(Path('claims.json').read_text(encoding='utf-8'))
          assert data.get('version') == ARTIFACT_VERSIONS['claims.json'], data.get('version')
          assert isinstance(data.get('events'), list)
          for event in data['events']:
              for claim in event.get('claims', []):
                  for required in ('claim_id', 'claim_type', 'claim_text', 'verification_status'):
                      assert required in claim, (event.get('event_id'), required)
                  assert claim['verification_status'] in allowed, claim['verification_status']
          assert data.get('claim_count') == data.get('cross_checked_claim_count', 0) + data.get('single_source_claim_count', 0) + data.get('unverified_claim_count', 0) + data.get('conflicted_claim_count', 0)
          print(f'Generated claim artifact v{data["version"]} valid: events={data["event_count"]} claims={data["claim_count"]}')
          PY
      - name: Event intelligence regression tests
        run: python3 -m unittest tests.test_intelligence_model tests.test_decision_review_boundary tests.test_claims_build tests.test_claims -v

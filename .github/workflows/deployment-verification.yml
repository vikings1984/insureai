name: Deployment Verification
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  SITE_URL: "https://vikings1984.github.io/insureai"
  DEPLOYMENT_MARKER: "InsureAI"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify published deployment
        run: python3 deployment_verification.py
      - name: Upload verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ github.run_id }}
          path: deployment_verification.json
          if-no-files-found: error

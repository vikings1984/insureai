name: Deployment Verification
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
env:
  DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL || '' }}
  DEPLOYMENT_MARKER: "InsureAI"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify published deployment
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Deployment verification attempt ${attempt}/5"
            if python3 deployment_verification.py; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 15
            fi
          done
          exit 1
      - name: Detect deployment state transition
        id: transition
        if: always()
        run: |
          output="$(python3 scripts/deployment_state_transition.py)"
          echo "$output"
          echo "state_changed=${output##*=}" >> "$GITHUB_OUTPUT"
      - name: Bridge verification into release provenance
        if: always() && steps.transition.outputs.state_changed == 'true' && hashFiles('deployment_verification.json','release_provenance.json') != ''
        run: python3 -c "from release_provenance import attach_deployment_verification; attach_deployment_verification(); print('Release provenance updated')"
      - name: Commit deployment state transition + optional provenance + history
        if: always() && steps.transition.outputs.state_changed == 'true'
        run: |
          git config user.name "insureai-bot"
          git config user.email "bot@insureai.local"
          files="deployment_verification.json deployment_verification_history.json"
          [ -f release_provenance.json ] && files="$files release_provenance.json"
          if [ -n "$(git status --porcelain $files)" ]; then
            git add $files
            git commit -m "chore: record deployment state transition [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No deployment state changes to commit"
          fi
      - name: Upload latest verification heartbeat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ github.run_id }}
          path: deployment_verification_latest.json
          if-no-files-found: error
      - name: Enforce verification result
        if: env.DEPLOYMENT_URL != ''
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open('deployment_verification_latest.json'))
          assert result.get('verified') is True, result
          print('Published deployment verified')
          PY
      - name: Report deployment URL configuration
        if: env.DEPLOYMENT_URL == ''
        run: echo 'Deployment verification is unconfigured: set the repository Actions variable DEPLOYMENT_URL.'
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'InsureAI 部署验证失败';
            const body = `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

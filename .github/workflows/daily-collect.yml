name: Daily Insurance News Collect

# 单分支架构：insureai 既是默认分支也是唯一应用分支。
# 流程：采集 → prerender(SEO) → 提交 data.json(+SEO) → push。
# data-url 指向同源 data.json（GitHub Pages 每次 push 自动重部署，数据即最新），
# 无需 jsDelivr CDN / SHA pin / purge —— 少三个脆弱环节，零接触刷新不变。
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 每6小时：UTC 00/06/12/18 = 北京时间 08/14/20/02
  workflow_dispatch:           # 支持手动触发

concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SITE_URL: "https://vikings1984.github.io/insureai"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector
        run: python3 collect.py

      - name: Data validation
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('data.json'))
          news = d.get('news', [])
          assert len(news) > 0, 'data.json news is empty!'
          assert isinstance(news, list), 'news is not a list'
          for n in news:
              assert 'title' in n and n['title'], f'missing title: {n}'
              assert 'published_at' in n, f'missing published_at: {n.get(\"title\",\"\")}'
          print(f'✅ Data validation passed: {len(news)} items')
          "

      - name: Run tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            python3 -m pytest tests/ -v --tb=short
          else
            python3 -m unittest discover tests/ -v
          fi

      - name: Prerender SEO (site = GitHub Pages)
        run: python3 prerender.py --site-url "$SITE_URL"

      - name: 采集质量自动评分 (ce-optimize)
        run: python3 scripts/quality_score.py

      - name: Commit data + SEO + 质量评分
        run: |
          git config user.name "insureai-bot"
          git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json index.html sitemap.xml research.json data/quality)" ]; then
            git add data.json index.html sitemap.xml research.json data/quality
            git commit -m "chore: auto-collect + prerender + quality-score $(date +%F)"
          else
            echo "no changes"
          fi

      - name: Push (triggers GitHub Pages redeploy)
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const timestamp = new Date().toISOString();
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `采集管道再次失败：${runUrl}\n\n时间: ${timestamp}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 CI Failed: 采集管道运行失败`,
                body: `采集管道运行失败，请检查：${runUrl}\n\n时间: ${timestamp}`,
                labels: ['ci-failure']
              });
            }

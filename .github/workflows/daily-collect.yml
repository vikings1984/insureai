name: Daily Insurance News Collect
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
concurrency:
  group: daily-collect
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  SITE_URL: "https://vikings1984.github.io/insureai"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run collector
        run: python3 collect.py
      - name: Commit collected news core data
        run: |
          git config user.name "insureai-bot"; git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json inbox.json data/translation_cache.json)" ]; then
            git add data.json inbox.json data/translation_cache.json
            git commit -m "chore: auto-collect news core $(date +%F)"
            git push origin HEAD:${{ github.ref_name }}
          else echo "no new data"; fi

  analyze:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build event-based intelligence
        run: python3 intelligence.py
      - name: Build claim/evidence intelligence
        run: python3 claims_build.py
      - name: Build evidence trust layer
        run: python3 trust_build.py
      - name: Build temporal intelligence
        run: python3 temporal_build.py
      - name: Build bounded human-feedback calibration
        run: python3 calibration.py
      - name: Build decision intelligence
        run: python3 decision_build.py
      - name: Analyze decision stability
        run: python3 decision_stability.py
      - name: Build decision credibility summary
        run: python3 decision_credibility.py
      - name: Run counterfactual robustness analysis
        run: python3 counterfactual.py
      - name: Run bounded scenario intelligence
        run: python3 scenario.py
      - name: Run cross-scenario decision matrix
        run: python3 scenario_matrix.py
      - name: Build actionable trigger rules
        run: python3 action_triggers.py
      - name: Build execution readiness packs
        run: python3 execution_readiness.py
      - name: Build auditable lineage ledger
        run: python3 audit_ledger.py
      - name: Analyze downstream change impact
        run: python3 change_impact.py
      - name: Validate and stamp data contract
        run: python3 contract.py
      - name: Evaluate intelligence quality
        run: python3 evaluation.py
      - name: Quantitative quality metrics gate
        run: python3 -c "from evaluation_metrics import build_metrics; m=build_metrics(); assert m['macro_quality'] >= 0.95, m; print(m)"
      - name: Production replay
        run: python3 production_replay.py
      - name: Build human review queue with change-impact priority
        run: python3 review.py
      - name: Attribute review feedback to modules
        run: python3 feedback_attribution.py
      - name: Build module health profile
        run: python3 module_health.py
      - name: Build module health trend
        run: python3 module_health_trend.py
      - name: Attribute temporal health trend
        run: python3 trend_attribution.py
      - name: Build optimization backlog
        run: python3 optimization_backlog.py
      - name: Build daily risk radar
        run: python3 daily_risk_radar.py
      - name: Build owner-facing risk view
        run: python3 owner_risk_view.py
      - name: Measure input-data freshness
        run: python3 freshness.py
      - name: Translate freshness into evidence availability
        run: python3 evidence_availability.py
      - name: Data validation
        run: python3 scripts/validate_data.py
      - name: Run tests
        run: python3 -m unittest discover tests/ -v
      - name: Build truthful release manifest
        run: python3 release_manifest.py
      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          m=json.load(open('release_manifest.json'))
          assert m.get('version') == SCHEMA_VERSIONS['release_manifest'] and m.get('release_channel') == RELEASE_CHANNEL
          assert m.get('quality_status') == 'passed' and m.get('deployment_status') == 'pending' and m.get('deployment_verified') is False
          assert m.get('source_commit')
          print('Release manifest valid: quality=passed deployment=pending')
          PY
      - name: Prerender SEO (site = GitHub Pages)
        run: python3 prerender.py --site-url "$SITE_URL"
      - name: Inject feature UI assets
        run: python3 scripts/inject_ui_assets.py
      - name: 采集质量自动评分 (ce-optimize)
        run: python3 scripts/quality_score.py
      - name: Build executive intelligence terminal
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 executive_terminal.py
      - name: Build knowledge graph
        run: python3 knowledge_graph.py
      - name: Validate knowledge graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('knowledge_graph.json').read_text(encoding='utf-8'))
          assert graph['graph'] == 'insureai_traceable_knowledge_graph'
          assert graph['stats']['node_count'] == len(graph['nodes'])
          assert graph['stats']['edge_count'] == len(graph['edges'])
          node_ids={n['id'] for n in graph['nodes']}
          for edge in graph['edges']:
              assert edge['source'] in node_ids
              assert edge['target'] in node_ids
              assert 0 <= edge['confidence'] <= 1
          assert graph['stats']['node_count'] > 0, 'knowledge graph must not be empty when intelligence artifacts exist'
          print('Knowledge graph valid:', graph['stats'])
          PY
      - name: Build final analytical audit ledger
        run: python3 audit_ledger.py
      - name: Validate final analytical audit ledger
        run: |
          python3 - <<'PY'
          import json
          ledger=json.load(open('audit_ledger.json'))
          required={'data.json','intelligence.json','claims.json','decision_stability.json','decision_credibility.json','counterfactual.json','scenario.json','scenario_matrix.json','action_triggers.json','execution_readiness.json','change_impact.json','freshness.json','evidence_availability.json','review_queue.json','feedback_attribution.json','module_health.json','module_health_history.json','module_health_trend.json','trend_attribution.json','optimization_backlog.json','optimization_backlog_history.json','daily_risk_radar.json','owner_risk_view.json','executive_terminal.json'}
          actual={row.get('artifact') for row in ledger.get('stages',[])}
          missing=required-actual
          assert not missing, f'missing audit artifacts: {sorted(missing)}'
          for row in ledger.get('stages',[]): assert len(row.get('sha256','')) == 64 and 'title' not in row and 'url' not in row and 'body' not in row
          assert ledger.get('privacy') == 'hashes_and_metadata_only'
          print(f'Final audit ledger valid: stages={len(ledger["stages"])}')
          PY
      - name: Restamp final release manifest after final audit
        run: python3 release_manifest.py
      - name: Validate final release manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          m=json.load(open('release_manifest.json'))
          audit=json.load(open('audit_ledger.json'))
          deployment=m.get('deployment_status')
          assert m.get('version') == SCHEMA_VERSIONS['release_manifest'] and m.get('release_channel') == RELEASE_CHANNEL
          assert m.get('quality_status') == 'passed' and m.get('deployment_status') == 'pending' and m.get('deployment_verified') is False
          assert len(m.get('release_marker','')) >= 8
          assert Path('index.html').read_text(encoding='utf-8').find(m['release_marker']) >= 0
          assert audit.get('privacy') == 'hashes_and_metadata_only'
          assert deployment in {'pending','stale','verified'}, m
          print('Final release manifest restamped after final audit')
          PY
      - name: Build final release provenance
        run: python3 release_provenance.py
      - name: Validate final release provenance
        run: |
          python3 - <<'PY'
          import json
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          p=json.load(open('release_provenance.json'))
          m=json.load(open('release_manifest.json'))
          assert p.get('version') == SCHEMA_VERSIONS['release_provenance'] and p.get('schema_version') == SCHEMA_VERSIONS['release_provenance_schema']
          assert p.get('source_commit') and p.get('release_channel') == RELEASE_CHANNEL
          assert p.get('quality',{}).get('status') == 'passed'
          assert p.get('quality',{}).get('audit_privacy') == 'hashes_and_metadata_only'
          assert p.get('quality',{}).get('audit_stage_count', 0) > 0
          deployment=p.get('deployment',{})
          assert deployment.get('status') in {'pending','stale','verified'}, deployment
          assert deployment.get('verified') is False or (deployment.get('status') == 'verified' and deployment.get('release_match') is True), deployment
          assert p.get('artifacts',{}).get('release_manifest_sha256')
          assert m.get('release_marker')
          for key in ('release_manifest_sha256','audit_ledger_sha256'): assert len(p['artifacts'][key]) == 64
          print(f'Final release provenance valid: deployment={deployment.get("status")} release_match={deployment.get("release_match")}')
          PY
      - name: Commit data + quality artifacts
        run: |
          git config user.name "insureai-bot"; git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json intelligence.json claims.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json trend_attribution.json optimization_backlog.json optimization_backlog_history.json release_manifest.json release_provenance.json decision_stability.json decision_history.json decision_credibility.json daily_risk_radar.json owner_risk_view.json freshness.json evidence_availability.json executive_terminal.json knowledge_graph.json index.html sitemap.xml research.json data/quality data/translation_cache.json)" ]; then
            git add data.json intelligence.json claims.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json trend_attribution.json optimization_backlog.json optimization_backlog_history.json release_manifest.json release_provenance.json decision_stability.json decision_history.json decision_credibility.json daily_risk_radar.json owner_risk_view.json freshness.json evidence_availability.json executive_terminal.json knowledge_graph.json index.html sitemap.xml research.json data/quality data/translation_cache.json
            git commit -m "chore: auto-collect + intelligence + claims + graph + executive terminal $(date +%F)"
          else echo "no changes"; fi
      - name: Push (triggers GitHub Pages redeploy)
        run: git push origin HEAD:${{ github.ref_name }}
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'InsureAI 自动采集失败';
            const body = `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

name: Daily Insurance News Collect

# 单分支架构：insureai 既是默认分支也是唯一应用分支。
# 流程：采集 → intelligence engine → trust layer → claim/evidence → temporal → decision → contract → radar/trends → prerender → UI → 质量评分 → push。
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SITE_URL: "https://vikings1984.github.io/insureai"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector
        run: python3 collect.py

      - name: Build event-based intelligence
        run: python3 intelligence.py

      - name: Build evidence trust layer
        run: python3 trust_build.py

      - name: Build temporal intelligence
        run: python3 temporal_build.py

      - name: Build decision intelligence
        run: python3 decision_build.py

      - name: Validate and stamp data contract
        run: python3 contract.py

      - name: Data validation
        run: |
          python3 -c "
          import json
          from contract import validate
          d = json.load(open('data.json'))
          news = d.get('news', [])
          assert isinstance(news, list) and news, 'data.json news is empty!'
          for n in news:
              assert n.get('title'), f'missing title: {n}'
              assert 'published_at' in n, f'missing published_at: {n.get(\"title\",\"\")}'
          i = json.load(open('intelligence.json'))
          errors = validate(i)
          assert not errors, 'contract errors: ' + '; '.join(errors[:10])
          contract = i.get('data_contract', {})
          assert contract.get('schema_version') == 1
          assert contract.get('intelligence_version') == 7
          assert isinstance(contract.get('components'), dict)
          assert isinstance(contract.get('counts'), dict)
          assert len(contract['components']) >= 6
          print(f'Validation passed: {len(news)} news -> {len(i[\"events\"])} events; decisions={len(i[\"decisions\"])}; schema={contract[\"schema_version\"]}')
          "

      - name: Run tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            python3 -m pytest tests/ -v --tb=short
          else
            python3 -m unittest discover tests/ -v
          fi

      - name: Prerender SEO (site = GitHub Pages)
        run: python3 prerender.py --site-url "$SITE_URL"

      - name: Inject Daily Intelligence UI
        run: python3 scripts/inject_intelligence_ui.py

      - name: Inject Personal Intelligence UI
        run: python3 scripts/inject_personalization_ui.py

      - name: Inject Trust UI
        run: python3 scripts/inject_trust_ui.py

      - name: Inject Claim Evidence UI
        run: python3 scripts/inject_claim_evidence_ui.py

      - name: Inject Temporal UI
        run: python3 scripts/inject_temporal_ui.py

      - name: Inject Decision UI
        run: python3 scripts/inject_decision_ui.py

      - name: 采集质量自动评分 (ce-optimize)
        run: python3 scripts/quality_score.py

      - name: Commit data + intelligence + SEO + 质量评分
        run: |
          git config user.name "insureai-bot"
          git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json intelligence.json index.html sitemap.xml research.json data/quality data/translation_cache.json)" ]; then
            git add data.json intelligence.json index.html sitemap.xml research.json data/quality data/translation_cache.json
            git commit -m "chore: auto-collect + intelligence + contract + trust + claims + temporal + decision $(date +%F)"
          else
            echo "no changes"
          fi

      - name: Push (triggers GitHub Pages redeploy)
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const timestamp = new Date().toISOString();
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `采集管道再次失败：${runUrl}\n\n时间: ${timestamp}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 CI Failed: 采集管道运行失败`,
                body: `采集管道运行失败，请检查：${runUrl}\n\n时间: ${timestamp}`,
                labels: ['ci-failure']
              });
            }

name: Daily Insurance News Collect

# 单分支架构：insureai 既是默认分支也是唯一应用分支。
# 流程：采集 → intelligence → trust → claims → temporal → calibration → decision → counterfactual → scenario → scenario matrix → action triggers → execution readiness → audit ledger → change impact → contract → evaluation → metrics → replay → review → module health → trend → optimization backlog → release manifest → publish。
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
concurrency:
  group: daily-collect
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  SITE_URL: "https://vikings1984.github.io/insureai"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run collector
        run: python3 collect.py
      - name: Build event-based intelligence
        run: python3 intelligence.py
      - name: Build evidence trust layer
        run: python3 trust_build.py
      - name: Build temporal intelligence
        run: python3 temporal_build.py
      - name: Build bounded human-feedback calibration
        run: python3 calibration.py
      - name: Build decision intelligence
        run: python3 decision_build.py
      - name: Run counterfactual robustness analysis
        run: python3 counterfactual.py
      - name: Run bounded scenario intelligence
        run: python3 scenario.py
      - name: Run cross-scenario decision matrix
        run: python3 scenario_matrix.py
      - name: Build actionable trigger rules
        run: python3 action_triggers.py
      - name: Build execution readiness packs
        run: python3 execution_readiness.py
      - name: Build auditable lineage ledger
        run: python3 audit_ledger.py
      - name: Analyze downstream change impact
        run: python3 change_impact.py
      - name: Validate and stamp data contract
        run: python3 contract.py
      - name: Evaluate intelligence quality
        run: python3 evaluation.py
      - name: Quantitative quality metrics gate
        run: python3 -c "from evaluation_metrics import build_metrics; m=build_metrics(); assert m['macro_quality'] >= 0.95, m; print(m)"
      - name: Production replay
        run: python3 production_replay.py
      - name: Build human review queue with change-impact priority
        run: python3 review.py
      - name: Attribute review feedback to modules
        run: python3 feedback_attribution.py
      - name: Build module health profile
        run: python3 module_health.py
      - name: Build module health trend
        run: python3 module_health_trend.py
      - name: Build optimization backlog
        run: python3 optimization_backlog.py
      - name: Data validation
        run: |
          python3 -c "
          import json
          from contract import validate
          d=json.load(open('data.json')); news=d.get('news',[])
          assert isinstance(news,list) and news, 'data.json news is empty!'
          for n in news: assert n.get('title') and 'published_at' in n
          i=json.load(open('intelligence.json')); errors=validate(i); assert not errors, 'contract errors: ' + '; '.join(errors[:10])
          q=json.load(open('review_queue.json')); assert q.get('version') == 1 and isinstance(q.get('items'),list)
          imp=json.load(open('change_impact.json')); assert imp.get('version') == 1 and isinstance(imp.get('impacted_events'),list) and isinstance(imp.get('baseline_available'),bool)
          ledger=json.load(open('audit_ledger.json')); assert ledger.get('version') == 1 and ledger.get('privacy') == 'hashes_and_metadata_only'
          for row in ledger.get('stages',[]): assert len(row.get('sha256','')) == 64 and 'title' not in row and 'url' not in row and 'body' not in row
          fb=json.load(open('feedback_attribution.json')); assert fb.get('version') == 1 and isinstance(fb.get('modules'),dict)
          mh=json.load(open('module_health.json')); assert mh.get('version') == 1 and isinstance(mh.get('modules'),list)
          mt=json.load(open('module_health_trend.json')); assert mt.get('version') == 1 and isinstance(mt.get('modules'),dict)
          ob=json.load(open('optimization_backlog.json')); assert ob.get('version') == 2 and isinstance(ob.get('items'),list)
          hist=json.load(open('optimization_backlog_history.json')); assert hist.get('version') == 1 and isinstance(hist.get('snapshots'),list) and len(hist['snapshots']) <= 90
          for item in ob['items']: assert item.get('status') in {'open','recovering','resolved','regressed'}
          print(f'Validation passed: news={len(news)} events={len(i["events"])} review={len(q["items"])} impacts={imp["impacted_count"]} backlog={len(ob["items"])} baseline={mt["baseline_available"]} backlog_history={len(hist["snapshots"])}')
          "
      - name: Run tests
        run: python3 -m unittest discover tests/ -v
      - name: Build truthful release manifest
        run: python3 release_manifest.py
      - name: Validate release manifest
        run: |
          python3 -c "
          import json
          m=json.load(open('release_manifest.json'))
          assert m.get('version') == 1
          assert m.get('release_channel') == 'github_pages'
          assert m.get('quality_status') == 'passed'
          assert m.get('deployment_status') == 'pending'
          assert m.get('deployment_verified') is False
          assert m.get('source_commit')
          print('Release manifest valid: quality=passed deployment=pending')
          "
      - name: Prerender SEO (site = GitHub Pages)
        run: python3 prerender.py --site-url "$SITE_URL"
      - name: Inject Daily Intelligence UI
        run: python3 scripts/inject_intelligence_ui.py
      - name: Inject Personal Intelligence UI
        run: python3 scripts/inject_personalization_ui.py
      - name: Inject Trust UI
        run: python3 scripts/inject_trust_ui.py
      - name: Inject Claim Evidence UI
        run: python3 scripts/inject_claim_evidence_ui.py
      - name: Inject Temporal UI
        run: python3 scripts/inject_temporal_ui.py
      - name: Inject Decision UI
        run: python3 scripts/inject_decision_ui.py
      - name: Inject Human Review UI
        run: python3 scripts/inject_review_ui.py
      - name: Inject Action Trigger UI
        run: python3 scripts/inject_action_triggers_ui.py
      - name: Inject Execution Readiness UI
        run: python3 scripts/inject_execution_readiness_ui.py
      - name: 采集质量自动评分 (ce-optimize)
        run: python3 scripts/quality_score.py
      - name: Commit data + intelligence + quality profile + release manifest + SEO
        run: |
          git config user.name "insureai-bot"; git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json intelligence.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json optimization_backlog.json optimization_backlog_history.json release_manifest.json index.html sitemap.xml research.json data/quality data/translation_cache.json)" ]; then
            git add data.json intelligence.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json optimization_backlog.json optimization_backlog_history.json release_manifest.json index.html sitemap.xml research.json data/quality data/translation_cache.json
            git commit -m "chore: auto-collect + intelligence + quality + release manifest $(date +%F)"
          else echo "no changes"; fi
      - name: Push (triggers GitHub Pages redeploy)
        run: git push origin HEAD:${{ github.ref_name }}
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.create({ owner, repo, title: `InsureAI 自动采集失败：${new Date().toISOString()}`, body: `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}` });

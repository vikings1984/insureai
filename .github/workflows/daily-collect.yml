name: Daily Insurance News Collect
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
concurrency:
  group: daily-collect
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  SITE_URL: "https://vikings1984.github.io/insureai"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run collector
        run: python3 collect.py
      - name: Commit collected news core data
        run: |
          git config user.name "insureai-bot"; git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json inbox.json data/translation_cache.json p2_monitoring_store.json p2_monitoring.json)" ]; then
            git add data.json inbox.json data/translation_cache.json p2_monitoring_store.json p2_monitoring.json
            git commit -m "chore: auto-collect news core $(date +%F)"
            git fetch origin "${{ github.ref_name }}"
            if git rebase --autostash "origin/${{ github.ref_name }}"; then
              git push origin HEAD:${{ github.ref_name }}
            else
              echo 'Remote advanced concurrently; dropping this collect push (next scheduled run re-publishes)'
              git rebase --abort || true
              git reset --merge || true
            fi
          else echo "no new data"; fi

  analyze:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build event-based intelligence
        run: python3 intelligence.py
      - name: Build claim/evidence intelligence
        run: python3 claims_build.py
      - name: Build evidence trust layer
        run: python3 trust_build.py
      - name: Build temporal intelligence
        run: python3 temporal_build.py
      - name: Build trend intelligence (event clusters + dynamics)
        run: python3 trend_intelligence.py
      - name: Build bounded human-feedback calibration
        run: python3 calibration.py
      - name: Build decision intelligence
        run: python3 decision_build.py
      - name: Analyze decision stability
        run: python3 decision_stability.py
      - name: Build decision credibility summary
        run: python3 decision_credibility.py
      - name: Run counterfactual robustness analysis
        run: python3 counterfactual.py
      - name: Run bounded scenario intelligence
        run: python3 scenario.py
      - name: Run cross-scenario decision matrix
        run: python3 scenario_matrix.py
      - name: Build actionable trigger rules
        run: python3 action_triggers.py
      - name: Build execution readiness packs
        run: python3 execution_readiness.py
      - name: Build auditable lineage ledger
        run: python3 audit_ledger.py
      - name: Analyze downstream change impact
        run: python3 change_impact.py
      - name: Validate and stamp data contract
        run: python3 contract.py
      - name: Evaluate intelligence quality
        run: python3 evaluation.py
      - name: Quantitative quality metrics gate
        run: python3 -c "from evaluation_metrics import build_metrics; m=build_metrics(); assert m['macro_quality'] >= 0.95, m; assert m['production']['claim_evidence_match_rate'] >= 0.6, m; print(m)"
      - name: Production replay
        run: python3 production_replay.py
      - name: Build human review queue with change-impact priority
        run: python3 review.py
      - name: Attribute review feedback to modules
        run: python3 feedback_attribution.py
      - name: Build E2 decision ledger (cumulative sample by event_id)
        run: python3 decision_ledger.py
      - name: Build knowledge graph
        run: python3 knowledge_graph.py
      - name: Validate knowledge graph
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('knowledge_graph.json').read_text(encoding='utf-8'))
          assert graph['graph'] == 'insureai_traceable_knowledge_graph'
          assert graph['stats']['node_count'] == len(graph['nodes'])
          assert graph['stats']['edge_count'] == len(graph['edges'])
          node_ids={n['id'] for n in graph['nodes']}
          for edge in graph['edges']:
              assert edge['source'] in node_ids
              assert edge['target'] in node_ids
              assert 0 <= edge['confidence'] <= 1
          assert graph['stats']['node_count'] > 0, 'knowledge graph must not be empty when intelligence artifacts exist'
          print('Knowledge graph valid:', graph['stats'])
          PY
      - name: Build module health profile
        run: python3 module_health.py
      - name: Build module health trend
        run: python3 module_health_trend.py
      - name: Attribute temporal health trend
        run: python3 trend_attribution.py
      - name: Build optimization backlog
        run: python3 optimization_backlog.py
      - name: Build daily risk radar
        run: python3 daily_risk_radar.py
      - name: Build owner-facing risk view
        run: python3 owner_risk_view.py
      - name: Measure input-data freshness
        run: python3 freshness.py
      - name: Translate freshness into evidence availability
        run: python3 evidence_availability.py
      - name: Data validation
        run: python3 scripts/validate_data.py
      - name: Run tests
        run: python3 -m unittest discover tests/ -v
      - name: Build truthful release manifest
        run: python3 release_manifest.py
      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          m=json.load(open('release_manifest.json'))
          assert m.get('version') == SCHEMA_VERSIONS['release_manifest'] and m.get('release_channel') == RELEASE_CHANNEL
          assert m.get('quality_status') == 'passed' and m.get('deployment_status') == 'pending' and m.get('deployment_verified') is False
          assert m.get('source_commit')
          print('Release manifest valid: quality=passed deployment=pending')
          PY
      - name: Prerender SEO (site = GitHub Pages)
        run: python3 prerender.py --site-url "$SITE_URL"
      - name: Inject feature UI assets
        run: python3 scripts/inject_ui_assets.py
      - name: 采集质量自动评分 (ce-optimize)
        run: python3 scripts/quality_score.py
      - name: Build executive intelligence terminal
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 executive_terminal.py
      - name: Build P2 daily intelligence brief
        run: python3 p2_intelligence.py
      - name: Validate P2 daily intelligence brief
        run: |
          python3 - <<'PY'
          import json
          brief=json.load(open('p2_daily_brief.json'))
          assert brief.get('version') == 'p2-v1.0', brief.get('version')
          assert brief.get('event_count', 0) > 0, 'daily brief must not be empty when intelligence artifacts exist'
          assert len(brief.get('brief', [])) > 0, 'daily brief must contain at least one ranked item'
          priorities=[row.get('daily_priority', 0) for row in brief['brief']]
          assert priorities == sorted(priorities, reverse=True), 'brief must be ordered by daily_priority'
          assert all(isinstance(p, int) and p > 0 for p in priorities), 'daily_priority must come from scores.intelligence_score'
          for row in brief['brief']: assert row.get('event_id'), 'brief rows must be event-addressable'
          print(f'P2 daily brief valid: events={brief["event_count"]} brief={len(brief["brief"])} hits={brief.get("watchlist_hits")}')
          PY
      - name: Build P2.1 continuous monitoring
        run: python3 p2_monitoring.py --news data.json
      - name: Validate P2.1 continuous monitoring
        run: |
          python3 - <<'PY'
          import json
          mon=json.load(open('p2_monitoring.json'))
          assert mon.get('version') == 'p2.1-v1.0', mon.get('version')
          assert mon.get('tracked_event_count', 0) > 0, 'monitoring must track events when intelligence artifacts exist'
          assert isinstance(mon.get('alert_count'), int) and mon.get('alert_count', 0) >= 0
          for a in mon.get('alerts', []):
              assert a.get('canonical_id') and a.get('change_type') and a.get('severity') in {'high','medium','low'}, a
          print(f"P2.1 monitoring valid: tracked={mon['tracked_event_count']} changes={mon['change_count']} alerts={mon['alert_count']}")
          PY
      - name: Build P2.2 decision feedback analytics
        run: python3 p2_feedback_analytics.py
      - name: Validate P2.2 decision feedback analytics
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('p2_feedback_analytics.json'))
          assert a.get('version') == 'p2.2-v1.0', a.get('version')
          m=a.get('analytics', {})
          for key in ('total','distinct_events','hit_rate','dismiss_rate','action_rate','repeat_exposure_rate','false_positive_rate','scored_coverage'):
              assert key in m, f'P2.2 missing metric: {key}'
          for key in ('hit_rate','dismiss_rate','action_rate','repeat_exposure_rate','false_positive_rate','scored_coverage'):
              assert isinstance(m[key], float) and 0.0 <= m[key] <= 1.0, f'P2.2 {key} out of [0,1]: {m[key]}'
          print(f"P2.2 feedback analytics valid: total={m['total']} distinct_events={m['distinct_events']} hit_rate={m['hit_rate']} action_rate={m['action_rate']} repeat_exposure={m['repeat_exposure_rate']}")
          PY
      - name: Build P2.5 personal memory
        run: python3 p2_personal_memory.py
      # 校验的重点不是数值大小，而是**纪律**：样本不足时不得输出结论、不得伪造时间线、
      # 推不出的维度必须写进 gaps。这三条一旦被绕过，个人记忆层就会开始编造用户偏好。
      - name: Validate P2.5 personal memory
        run: |
          python3 - <<'PY'
          from p2_personal_memory import MIN_SAMPLE_FOR_CONCLUSION, VERSION, validate
          import json
          doc=json.load(open('p2_personal_memory.json'))
          validate(doc)  # fail-closed：内部结构不对即抛错
          assert doc.get('version') == VERSION, doc.get('version')
          obs=doc['decisions']['observations']
          assert obs['sample_size'] >= 0
          assert obs.get('has_decided_at') is True, 'E2 后决策画像应已携带真实 decided_at（引擎产出时间，非用户决策时间）'
          if obs['sample_size'] < MIN_SAMPLE_FOR_CONCLUSION:
              assert doc['decisions']['conclusions'] == [], '样本不足却输出了偏好结论'
              assert doc['decisions']['conclusion_blocked'], '样本不足却未给出阻塞原因'
          # 记忆条目来自复核队列已决事件（含 rich context），数量须等于复核队列已决数；
          # 不得与账本累计样本量（含无 rich context 的引擎决策）混比。
          decided=doc['sources']['review_queue.json']['decided']
          assert len(doc['memory_entries']) == decided, '记忆条目数与复核队列已决数不一致'
          for e in doc['memory_entries']:
              assert e.get('event_id') and e.get('decision'), e
              da=e.get('decided_at')
              assert da, 'E2 后 memory entry 必须携带真实 decided_at（引擎产出时间，非用户决策时间）'
              assert (da.endswith('Z') or da.startswith('20')) and 'T' in da, f'decided_at 时间戳格式异常: {da}'
          assert doc['gaps'], 'gaps 不得为空（推不出的维度必须显式记录）'
          print(f"P2.5 personal memory valid: decided={obs['sample_size']} has_decided_at={obs['has_decided_at']} conclusions={len(doc['decisions']['conclusions'])} entities={len(doc['entity_affinity']['acted_entities'])} gaps={len(doc['gaps'])}")
          PY
      # P2.6 Role-based Second Brain：把个人记忆按角色切片 + 补实体跨事件时间线。
      # 纪律与 P2.5 一致：只聚合既有 artifact；角色视图是过滤非推断；推不出的写 open_questions。
      - name: Build P2.6 second brain
        run: python3 second_brain.py
      - name: Validate P2.6 second brain
        run: |
          python3 - <<'PY'
          from second_brain import VERSION, validate
          import json
          doc=json.load(open('second_brain.json'))
          validate(doc)  # fail-closed：roles 不完整 / open_questions 为空即抛错
          assert doc.get('version') == VERSION, doc.get('version')
          assert set(doc['roles']) == {'strategy','operations','risk'}, set(doc['roles'])
          assert doc['entity_threads'], '实体时间线不应为空（图谱有事件却未派生）'
          assert doc['open_questions'], 'open_questions 不得为空（推不出/无信号维度必须显式记录）'
          print(f"P2.6 second brain valid: roles={list(doc['roles'])} threads={len(doc['entity_threads'])} open_questions={len(doc['open_questions'])}")
          PY
      # S1 Canonical Event Registry（Event OS 主脊柱使能层）：
      # 用确定性 sha256(event_id)[:12] 派生 canonical_event_id，建立全局事件身份层。
      # 只聚合既有 artifact（daily_brief / review_queue），不伪造身份。fail-closed。
      - name: Build S1 canonical event registry
        run: python3 event_registry.py
      - name: Validate S1 canonical event registry
        run: |
          python3 - <<'PY'
          import json
          from event_registry import validate, resolve, VERSION
          reg=json.load(open('canonical_events.json'))
          validate(reg)  # fail-closed：id 不自洽 / 悬空引用 / 源未覆盖即抛错
          assert reg.get('version') == VERSION, reg.get('version')
          ali=json.load(open('event_id_aliases.json'))
          assert ali.get('version') == VERSION, ali.get('version')
          bad=[a for a in ali.get('aliases',{}).values() if not resolve(a, reg)]
          assert not bad, f"悬空别名: {bad[:5]}"
          active=sum(1 for r in reg['canonical_events'].values() if r.get('status')=='active')
          print(f"S1 registry valid: canonical={reg['count']} active={active} aliases={len(ali.get('aliases',{}))}")
          PY
      # S2 Identity Resolver（Event OS 主脊柱 S2）：把各模块局部身份统一解析到 canonical_event_id。
      # 只解析、不发明身份；候选合并 observation-only（status=proposed），不自动执行。fail-closed。
      - name: Build S2 identity resolver report
        run: python3 identity_resolver.py
      - name: Validate S2 identity resolver report
        run: |
          python3 - <<'PY'
          import json
          from identity_resolver import validate, VERSION
          rep=json.load(open('resolver_report.json'))
          validate(rep)  # fail-closed：计数不自洽 / 候选被标记为已执行即抛错
          assert rep.get('version') == VERSION, rep.get('version')
          print(f"S2 resolver valid: refs={rep['total_references']} resolved={rep['resolved']} unresolved={rep['unresolved']} candidates={rep['candidate_merges']['count']}")
          PY
      # S3 Acquisition Lifecycle（Event OS 主脊柱 S3）：阶段源自 Claim+Evidence，富集回 canonical_events。
      # 非 M&A 事件标记 n/a（不伪造）；无进展信号→rumor 地板。fail-closed。
      - name: Build S3 acquisition lifecycle
        run: python3 acquisition_lifecycle.py
      - name: Validate S3 acquisition lifecycle
        run: |
          python3 - <<'PY'
          import json
          from acquisition_lifecycle import validate, VERSION
          rep=json.load(open('lifecycle_report.json'))
          validate(rep)  # fail-closed：非法 stage / 计数不自洽即抛错
          assert rep.get('version') == VERSION, rep.get('version')
          print(f"S3 lifecycle valid: canonical={rep['total_canonical']} acq={rep['acquisition_events']} stages={rep['stage_counts']}")
          PY
      # S4 Semantic Alert（Event OS 主脊柱 S4）：把每日底层变化收敛为 ≤8 条语义告警。
      # 两层（Internal Diff → Semantic Alert）；delta 不伪造、首跑仅种子；fail-closed。
      - name: Build S4 semantic alerts
        run: python3 semantic_alert.py
      - name: Validate S4 semantic alerts
        run: |
          python3 - <<'PY'
          import json
          from semantic_alert import validate, VERSION, MAX_ALERTS
          doc=json.load(open('p2_alerts.json'))
          validate(doc)  # fail-closed：>8 条 / 类型非法 / basis 非法即抛错
          assert doc.get('version') == VERSION, doc.get('version')
          assert doc['meta']['alert_count'] <= MAX_ALERTS, f"告警超上限: {doc['meta']['alert_count']}"
          base=json.load(open('p2_alert_baseline.json'))
          assert base.get('snapshots'), "基线快照缺失"
          print(f"S4 alerts valid: basis={doc['meta']['basis']} diffs={doc['meta']['internal_diff_count']} alerts={doc['meta']['alert_count']} types={doc['meta']['alert_type_counts']}")
          PY
      # S5 Decision Funnel（Event OS 主脊柱 S5）：把 review_queue 待决策洪流收敛为漏斗。
      # 承接 E2 决策账本（已决只来自真实决策记录）；待决分桶为可观测代理；样本<30 不结论；fail-closed。
      - name: Build S5 decision funnel
        run: python3 decision_funnel.py
      - name: Validate S5 decision funnel
        run: |
          python3 - <<'PY'
          import json
          from decision_funnel import validate, VERSION, MIN_SAMPLE
          doc=json.load(open('decisions_pending.json'))
          validate(doc)  # fail-closed：计数不自洽 / 分桶非法 / 缺 canonical_event_id 即抛错
          assert doc.get('version') == VERSION, doc.get('version')
          m=doc['meta']
          assert m['decision_required'] == m['decided'] + m['pending'], '漏斗计数不自洽'
          assert sum(m['pending_by_tier'].values()) == m['pending'], '分桶计数不自洽'
          print(f"S5 funnel valid: required={m['decision_required']} decided={m['decided']} pending={m['pending']} tiers={m['pending_by_tier']} sample={m['decided_sample_size']}/{MIN_SAMPLE} reached={m['reached_threshold']}")
          PY
      - name: Build final analytical audit ledger
        run: python3 audit_ledger.py
      - name: Validate final analytical audit ledger
        run: |
          python3 - <<'PY'
          import json
          ledger=json.load(open('audit_ledger.json'))
          required={'data.json','intelligence.json','claims.json','decision_stability.json','decision_credibility.json','counterfactual.json','scenario.json','scenario_matrix.json','action_triggers.json','execution_readiness.json','change_impact.json','freshness.json','evidence_availability.json','review_queue.json','feedback_attribution.json','module_health.json','module_health_history.json','module_health_trend.json','trend_attribution.json','radar.json','optimization_backlog.json','optimization_backlog_history.json','daily_risk_radar.json','owner_risk_view.json','executive_terminal.json','p2_daily_brief.json'}
          actual={row.get('artifact') for row in ledger.get('stages',[])}
          missing=required-actual
          assert not missing, f'missing audit artifacts: {sorted(missing)}'
          for row in ledger.get('stages',[]): assert len(row.get('sha256','')) == 64 and 'title' not in row and 'url' not in row and 'body' not in row
          assert ledger.get('privacy') == 'hashes_and_metadata_only'
          print(f'Final audit ledger valid: stages={len(ledger["stages"])}')
          PY
      - name: Restamp final release manifest after final audit
        run: python3 release_manifest.py
      - name: Validate final release manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          m=json.load(open('release_manifest.json'))
          audit=json.load(open('audit_ledger.json'))
          deployment=m.get('deployment_status')
          assert m.get('version') == SCHEMA_VERSIONS['release_manifest'] and m.get('release_channel') == RELEASE_CHANNEL
          assert m.get('quality_status') == 'passed' and m.get('deployment_status') == 'pending' and m.get('deployment_verified') is False
          assert len(m.get('release_marker','')) >= 8
          assert Path('index.html').read_text(encoding='utf-8').find(m['release_marker']) >= 0
          assert audit.get('privacy') == 'hashes_and_metadata_only'
          assert deployment in {'pending','stale','verified'}, m
          print('Final release manifest restamped after final audit')
          PY
      - name: Build final release provenance
        run: python3 release_provenance.py
      - name: Validate final release provenance
        run: |
          python3 - <<'PY'
          import json
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          p=json.load(open('release_provenance.json'))
          m=json.load(open('release_manifest.json'))
          assert p.get('version') == SCHEMA_VERSIONS['release_provenance'] and p.get('schema_version') == SCHEMA_VERSIONS['release_provenance_schema']
          assert p.get('source_commit') and p.get('release_channel') == RELEASE_CHANNEL
          assert p.get('quality',{}).get('status') == 'passed'
          assert p.get('quality',{}).get('audit_privacy') == 'hashes_and_metadata_only'
          assert p.get('quality',{}).get('audit_stage_count', 0) > 0
          deployment=p.get('deployment',{})
          assert deployment.get('status') in {'pending','stale','verified'}, deployment
          assert deployment.get('verified') is False or (deployment.get('status') == 'verified' and deployment.get('release_match') is True), deployment
          assert p.get('artifacts',{}).get('release_manifest_sha256')
          assert m.get('release_marker')
          for key in ('release_manifest_sha256','audit_ledger_sha256'): assert len(p['artifacts'][key]) == 64
          print(f'Final release provenance valid: deployment={deployment.get("status")} release_match={deployment.get("release_match")}')
          PY
      - name: Commit data + quality artifacts
        run: |
          git config user.name "insureai-bot"; git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json intelligence.json claims.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json trend_attribution.json radar.json optimization_backlog.json optimization_backlog_history.json release_manifest.json release_provenance.json decision_stability.json decision_history.json decision_credibility.json daily_risk_radar.json owner_risk_view.json freshness.json evidence_availability.json executive_terminal.json knowledge_graph.json p2_daily_brief.json p2_state.json index.html sitemap.xml rss.xml research.json data/quality data/translation_cache.json p2_monitoring_store.json p2_monitoring.json p2_feedback_analytics.json p2_personal_memory.json decisions_ledger.json second_brain.json canonical_events.json event_id_aliases.json resolver_report.json resolver_fingerprint_map.json lifecycle_report.json p2_alerts.json p2_alert_baseline.json decisions_pending.json)" ]; then
          git add data.json intelligence.json claims.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json trend_attribution.json radar.json optimization_backlog.json optimization_backlog_history.json release_manifest.json release_provenance.json decision_stability.json decision_history.json decision_credibility.json daily_risk_radar.json owner_risk_view.json freshness.json evidence_availability.json executive_terminal.json knowledge_graph.json p2_daily_brief.json p2_state.json index.html sitemap.xml rss.xml research.json data/quality data/translation_cache.json p2_monitoring_store.json p2_monitoring.json p2_feedback_analytics.json p2_personal_memory.json decisions_ledger.json second_brain.json canonical_events.json event_id_aliases.json resolver_report.json resolver_fingerprint_map.json lifecycle_report.json p2_alerts.json p2_alert_baseline.json decisions_pending.json
            git commit -m "chore: auto-collect + intelligence + claims + graph + executive terminal + daily brief + personal memory $(date +%F)"
          else echo "no changes"; fi
      - name: Push (triggers GitHub Pages redeploy)
        run: |
          git fetch origin "${{ github.ref_name }}"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${{ github.ref_name }}")" ]; then
            echo 'nothing to push'; exit 0
          fi
          if git rebase --autostash "origin/${{ github.ref_name }}"; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo 'Remote advanced concurrently; dropping this analyze push (next scheduled run re-publishes)'
            git rebase --abort || true
            git reset --merge || true
          fi
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'InsureAI 自动采集失败';
            const body = `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

name: Daily Insurance News Collect
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
concurrency:
  group: daily-collect
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
env:
  SITE_URL: "https://vikings1984.github.io/insureai"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default = insureai)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run collector
        run: python3 collect.py
      - name: Build event-based intelligence
        run: python3 intelligence.py
      - name: Build evidence trust layer
        run: python3 trust_build.py
      - name: Build temporal intelligence
        run: python3 temporal_build.py
      - name: Build bounded human-feedback calibration
        run: python3 calibration.py
      - name: Build decision intelligence
        run: python3 decision_build.py
      - name: Analyze decision stability
        run: python3 decision_stability.py
      - name: Build decision credibility summary
        run: python3 decision_credibility.py
      - name: Run counterfactual robustness analysis
        run: python3 counterfactual.py
      - name: Run bounded scenario intelligence
        run: python3 scenario.py
      - name: Run cross-scenario decision matrix
        run: python3 scenario_matrix.py
      - name: Build actionable trigger rules
        run: python3 action_triggers.py
      - name: Build execution readiness packs
        run: python3 execution_readiness.py
      - name: Build auditable lineage ledger
        run: python3 audit_ledger.py
      - name: Analyze downstream change impact
        run: python3 change_impact.py
      - name: Validate and stamp data contract
        run: python3 contract.py
      - name: Evaluate intelligence quality
        run: python3 evaluation.py
      - name: Quantitative quality metrics gate
        run: python3 -c "from evaluation_metrics import build_metrics; m=build_metrics(); assert m['macro_quality'] >= 0.95, m; print(m)"
      - name: Production replay
        run: python3 production_replay.py
      - name: Build human review queue with change-impact priority
        run: python3 review.py
      - name: Attribute review feedback to modules
        run: python3 feedback_attribution.py
      - name: Build module health profile
        run: python3 module_health.py
      - name: Build module health trend
        run: python3 module_health_trend.py
      - name: Attribute temporal health trend
        run: python3 trend_attribution.py
      - name: Build optimization backlog
        run: python3 optimization_backlog.py
      - name: Build daily risk radar
        run: python3 daily_risk_radar.py
      - name: Build owner-facing risk view
        run: python3 owner_risk_view.py
      - name: Data validation
        run: |
          python3 - <<'PY'
          import json
          from contract import validate

          def load(name):
              with open(name, encoding='utf-8') as f:
                  return json.load(f)

          def check(label, condition, detail=''):
              if not condition:
                  raise AssertionError(f'{label}: {detail}')

          d = load('data.json'); news = d.get('news', [])
          check('news', isinstance(news, list) and bool(news), f'count={len(news) if isinstance(news, list) else "not-list"}')
          for index, n in enumerate(news):
              check(f'news[{index}]', bool(n.get('title')) and 'published_at' in n, str(n)[:240])

          i = load('intelligence.json'); errors = validate(i)
          check('intelligence contract', not errors, '; '.join(errors[:10]))

          s = load('decision_stability.json')
          check('decision_stability', s.get('version') == 1 and isinstance(s.get('results'), list), str(s)[:240])
          sh = load('decision_history.json')
          check('decision_history', sh.get('version') == 1 and isinstance(sh.get('snapshots'), list) and len(sh['snapshots']) <= 90, str(sh)[:240])
          cred = load('decision_credibility.json')
          check('decision_credibility', cred.get('version') == 3 and cred.get('status') in {'ready','review','caution','blocked'} and isinstance(cred.get('provenance'), dict) and isinstance(cred.get('reasons'), list) and len(cred.get('signal_details', [])) == 5, str(cred)[:400])
          radar = load('daily_risk_radar.json')
          check('daily_risk_radar', radar.get('version') == 1 and isinstance(radar.get('items'), list) and radar.get('status') in {'ready','review','caution','blocked','unknown'}, str(radar)[:400])
          owner = load('owner_risk_view.json')
          check('owner_risk_view', owner.get('version') == 2 and isinstance(owner.get('items'), list) and owner.get('item_count', 0) >= len(owner['items']) and isinstance(owner.get('credibility'), dict), str(owner)[:500])
          check('owner credibility', owner['credibility'].get('status') in {'ready','review','caution','blocked','unknown'} and isinstance(owner['credibility'].get('reasons'), list) and isinstance(owner['credibility'].get('provenance'), dict) and len(owner['credibility'].get('signal_details', [])) == 5, str(owner['credibility'])[:500])
          for index, item in enumerate(owner['items']):
              check(f'owner item {index}', item.get('automation') == 'advisory_only' and item.get('owners') and item.get('deadline') and item.get('next_step'), str(item)[:400])

          ta = load('trend_attribution.json')
          check('trend_attribution', ta.get('version') == 1 and isinstance(ta.get('modules'), dict), str(ta)[:300])
          for key, row in ta['modules'].items():
              check(f'trend module {key}', row.get('classification') in {'baseline','single_spike','persistent_worsening','improving','recovering','recovered','stable'}, str(row)[:300])

          q = load('review_queue.json')
          check('review_queue', q.get('version') == 1 and isinstance(q.get('items'), list), str(q)[:300])
          imp = load('change_impact.json')
          check('change_impact', imp.get('version') == 1 and isinstance(imp.get('impacted_events'), list) and isinstance(imp.get('baseline_available'), bool), str(imp)[:300])
          ledger = load('audit_ledger.json')
          check('audit_ledger', ledger.get('version') == 1 and ledger.get('privacy') == 'hashes_and_metadata_only', str(ledger)[:300])
          for index, row in enumerate(ledger.get('stages', [])):
              check(f'audit stage {index}', len(row.get('sha256', '')) == 64 and 'title' not in row and 'url' not in row and 'body' not in row, str(row)[:300])

          fb = load('feedback_attribution.json')
          check('feedback_attribution', fb.get('version') == 1 and isinstance(fb.get('modules'), dict), str(fb)[:300])
          mh = load('module_health.json')
          check('module_health', mh.get('version') == 1 and isinstance(mh.get('modules'), list), str(mh)[:300])
          mt = load('module_health_trend.json')
          check('module_health_trend', mt.get('version') == 1 and isinstance(mt.get('modules'), dict), str(mt)[:300])
          ob = load('optimization_backlog.json')
          check('optimization_backlog', ob.get('version') == 3 and isinstance(ob.get('items'), list), str(ob)[:300])
          hist = load('optimization_backlog_history.json')
          check('optimization_backlog_history', hist.get('version') == 2 and isinstance(hist.get('snapshots'), list) and len(hist['snapshots']) <= 90, str(hist)[:300])
          for index, item in enumerate(ob['items']):
              check(f'backlog item {index}', item.get('status') in {'open','recovering','resolved','regressed'}, str(item)[:300])

          print(f'Validation passed: news={len(news)} events={len(i["events"])} stability={len(s["results"])} credibility={cred["status"]} radar={len(radar["items"])} owner_view={len(owner["items"])} trend_attribution={len(ta["modules"])} review={len(q["items"])} impacts={imp["impacted_count"]} backlog={len(ob["items"])} baseline={mt["baseline_available"]}')
          PY
      - name: Run tests
        run: python3 -m unittest discover tests/ -v
      - name: Build truthful release manifest
        run: python3 release_manifest.py
      - name: Validate release manifest
        run: |
          python3 -c "
          import json
          m=json.load(open('release_manifest.json'))
          assert m.get('version') == 1 and m.get('release_channel') == 'cloudflare_workers'
          assert m.get('quality_status') == 'passed' and m.get('deployment_status') == 'pending' and m.get('deployment_verified') is False
          assert m.get('source_commit')
          print('Release manifest valid: quality=passed deployment=pending')
          "
      - name: Prerender SEO (site = GitHub Pages)
        run: python3 prerender.py --site-url "$SITE_URL"
      - name: Inject Daily Intelligence UI
        run: python3 scripts/inject_intelligence_ui.py
      - name: Inject Personal Intelligence UI
        run: python3 scripts/inject_personalization_ui.py
      - name: Inject Trust UI
        run: python3 scripts/inject_trust_ui.py
      - name: Inject Claim Evidence UI
        run: python3 scripts/inject_claim_evidence_ui.py
      - name: Inject Temporal UI
        run: python3 scripts/inject_temporal_ui.py
      - name: Inject Decision UI
        run: python3 scripts/inject_decision_ui.py
      - name: Inject Human Review UI
        run: python3 scripts/inject_review_ui.py
      - name: Inject Action Trigger UI
        run: python3 scripts/inject_action_triggers_ui.py
      - name: Inject Execution Readiness UI
        run: python3 scripts/inject_execution_readiness_ui.py
      - name: Inject Owner Risk UI
        run: python3 scripts/inject_owner_risk_ui.py
      - name: 采集质量自动评分 (ce-optimize)
        run: python3 scripts/quality_score.py
      - name: Build final analytical audit ledger
        run: python3 audit_ledger.py
      - name: Validate final analytical audit ledger
        run: |
          python3 -c "
          import json
          ledger=json.load(open('audit_ledger.json'))
          required={'data.json','intelligence.json','decision_stability.json','decision_credibility.json','counterfactual.json','scenario.json','scenario_matrix.json','action_triggers.json','execution_readiness.json','change_impact.json','freshness.json','evidence_availability.json','review_queue.json','feedback_attribution.json','module_health.json','module_health_history.json','module_health_trend.json','trend_attribution.json','optimization_backlog.json','optimization_backlog_history.json','daily_risk_radar.json','owner_risk_view.json'}
          actual={row.get('artifact') for row in ledger.get('stages',[])}
          missing=required-actual
          assert not missing, f'missing audit artifacts: {sorted(missing)}'
          for row in ledger.get('stages',[]): assert len(row.get('sha256','')) == 64 and 'title' not in row and 'url' not in row and 'body' not in row
          assert ledger.get('privacy') == 'hashes_and_metadata_only'
          print(f'Final audit ledger valid: stages={len(ledger["stages"])}')
          "
      - name: Restamp final release manifest after final audit
        run: python3 release_manifest.py
      - name: Validate final release manifest
        run: |
          python3 -c "
          import json
          from pathlib import Path
          m=json.load(open('release_manifest.json'))
          audit=json.load(open('audit_ledger.json'))
          assert m.get('version') == 1 and m.get('release_channel') == 'cloudflare_workers'
          assert m.get('quality_status') == 'passed' and m.get('deployment_status') == 'pending' and m.get('deployment_verified') is False
          assert len(m.get('release_marker','')) >= 8
          assert Path('index.html').read_text(encoding='utf-8').find(m['release_marker']) >= 0
          assert audit.get('privacy') == 'hashes_and_metadata_only'
          print('Final release manifest restamped after final audit')
          "
      - name: Build final release provenance
        run: python3 release_provenance.py
      - name: Validate final release provenance
        run: |
          python3 -c "
          import json
          p=json.load(open('release_provenance.json'))
          m=json.load(open('release_manifest.json'))
          assert p.get('version') == 1 and p.get('schema_version') == 'release-provenance-v1'
          assert p.get('source_commit') and p.get('release_channel') == 'cloudflare_workers'
          assert p.get('quality',{}).get('status') == 'passed'
          assert p.get('quality',{}).get('audit_privacy') == 'hashes_and_metadata_only'
          assert p.get('quality',{}).get('audit_stage_count', 0) > 0
          deployment=p.get('deployment',{})
          assert deployment.get('status') in {'pending','stale','verified'}, deployment
          assert deployment.get('verified') is False or (deployment.get('status') == 'verified' and deployment.get('release_match') is True), deployment
          assert p.get('artifacts',{}).get('release_manifest_sha256')
          assert m.get('release_marker')
          for key in ('release_manifest_sha256','audit_ledger_sha256'): assert len(p['artifacts'][key]) == 64
          print(f'Final release provenance valid against restamped manifest: deployment={deployment.get("status")} release_match={deployment.get("release_match")}')
          "
      - name: Commit data + quality artifacts
        run: |
          git config user.name "insureai-bot"; git config user.email "bot@insureai.local"
          if [ -n "$(git status --porcelain data.json intelligence.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json trend_attribution.json optimization_backlog.json optimization_backlog_history.json release_manifest.json release_provenance.json decision_stability.json decision_history.json decision_credibility.json daily_risk_radar.json owner_risk_view.json index.html sitemap.xml research.json data/quality data/translation_cache.json)" ]; then
            git add data.json intelligence.json calibration.json counterfactual.json scenario.json scenario_matrix.json action_triggers.json execution_readiness.json audit_ledger.json change_impact.json review_queue.json feedback_attribution.json module_health.json module_health_history.json module_health_trend.json trend_attribution.json optimization_backlog.json optimization_backlog_history.json release_manifest.json release_provenance.json decision_stability.json decision_history.json decision_credibility.json daily_risk_radar.json owner_risk_view.json index.html sitemap.xml research.json data/quality data/translation_cache.json
            git commit -m "chore: auto-collect + intelligence + quality + provenance $(date +%F)"
          else echo "no changes"; fi
      - name: Push (triggers GitHub Pages redeploy)
        run: git push origin HEAD:${{ github.ref_name }}
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.create({ owner, repo, title: `InsureAI 自动采集失败：${new Date().toISOString()}`, body: `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}` });

name: Release Provenance
on:
  pull_request:
    branches: [insureai]
  push:
    branches: [insureai]
    paths:
      - release_manifest.json
      - audit_ledger.json
      - release_provenance.json
      - change_impact.json
      - release_provenance.py
      - tests/test_release_provenance.py
      - .github/workflows/release-provenance.yml
  workflow_dispatch:
jobs:
  validate:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test release provenance
        run: python3 -m unittest tests.test_release_provenance -v
      - name: Validate release provenance contract
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from contract import RELEASE_CHANNEL, SCHEMA_VERSIONS
          path = Path('release_provenance.json')
          event = os.environ['EVENT_NAME']
          if not path.exists():
              assert event == 'pull_request', 'release_provenance.json missing on non-PR event'
              print('PR validation: runtime provenance not present yet; contract deferred to push validation')
              raise SystemExit(0)
          p = json.loads(path.read_text(encoding='utf-8'))
          assert p.get('version') == SCHEMA_VERSIONS['release_provenance']
          assert p.get('schema_version') == SCHEMA_VERSIONS['release_provenance_schema']
          assert p.get('source_commit')
          assert p.get('release_channel') == RELEASE_CHANNEL
          assert p.get('quality', {}).get('status') in {'passed', 'failed', 'unknown'}
          assert p.get('quality', {}).get('audit_privacy') == 'hashes_and_metadata_only'
          assert p.get('deployment', {}).get('status') in {'pending', 'verified', 'failed', 'unknown'}
          assert isinstance(p.get('deployment', {}).get('verified'), bool)
          assert p.get('quality', {}).get('audit_stage_count', 0) > 0
          for key in ('release_manifest_sha256', 'audit_ledger_sha256'):
              value = p.get('artifacts', {}).get(key)
              assert isinstance(value, str) and len(value) == 64
          print('Release provenance valid')

      - name: Notify on failure (mainline push only, not PR)
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'InsureAI 发布溯源校验失败';
            const body = `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

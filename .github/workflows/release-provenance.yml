name: Release Provenance
on:
  pull_request:
    branches: [insureai]
  push:
    branches: [insureai]
    paths:
      - release_manifest.json
      - audit_ledger.json
      - release_provenance.json
      - change_impact.json
      - release_provenance.py
      - tests/test_release_provenance.py
      - .github/workflows/release-provenance.yml
  workflow_dispatch:
jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test release provenance
        run: python3 -m unittest tests.test_release_provenance -v
      - name: Validate committed release provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('release_provenance.json')
          assert path.exists(), 'release_provenance.json missing'
          p = json.loads(path.read_text(encoding='utf-8'))
          assert p.get('version') == 1
          assert p.get('schema_version') == 'release-provenance-v1'
          assert p.get('source_commit')
          assert p.get('release_channel') == 'github_pages'
          assert p.get('quality', {}).get('status') in {'passed', 'failed', 'unknown'}
          assert p.get('quality', {}).get('audit_privacy') == 'hashes_and_metadata_only'
          assert p.get('deployment', {}).get('status') in {'pending', 'verified', 'failed', 'unknown'}
          assert isinstance(p.get('deployment', {}).get('verified'), bool)
          assert p.get('quality', {}).get('audit_stage_count', 0) > 0
          for key in ('release_manifest_sha256', 'audit_ledger_sha256'):
              value = p.get('artifacts', {}).get(key)
              assert isinstance(value, str) and len(value) == 64
          print('Release provenance valid')
          PY

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsureAI · Executive Terminal</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;color:#172033;background:#f4f6f8;line-height:1.5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.brand{font-size:24px;font-weight:800}.brand span{color:#f97316}.muted{color:#667085;font-size:13px}.btn{padding:8px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;text-decoration:none;color:#344054}.hero{background:#172033;color:#fff;border-radius:16px;padding:22px;margin-bottom:18px}.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.hero-card{background:rgba(255,255,255,.08);border-radius:12px;padding:14px}.hero-card strong{display:block;font-size:25px;margin-top:5px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px}.title{font-size:17px;font-weight:750;margin-bottom:12px}.item{padding:13px 0;border-top:1px solid #eaecf0}.item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:12px}.tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:#f2f4f7;font-size:12px}.good{color:#067647;background:#ecfdf3}.warn{color:#b54708;background:#fffaeb}.bad{color:#b42318;background:#fef3f2}.metric{font-size:26px;font-weight:800}.list{display:grid;gap:10px}.empty{text-align:center;padding:35px;color:#667085}.small{font-size:12px;color:#98a2b3}.footer{margin-top:18px;color:#667085;font-size:12px}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:14px}.hero-grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
</head>
<body><div class="shell">
<div class="top"><div><div class="brand">Insure<span>AI</span> · Executive Terminal</div><div class="muted">管理层每日情报：变化、证据、风险与需要人工判断的事项</div></div><div><a class="btn" href="./intelligence.html">Intelligence</a> <a class="btn" href="./">主站</a></div></div>
<section class="hero"><div style="font-size:20px;font-weight:750">今日情报摘要</div><div class="muted" style="color:#c6cbd4">只展示现有 artifact 中已经存在的事实，不补写未验证结论。</div><div id="summary" class="hero-grid"><div class="hero-card">加载中…</div></div></section>
<div class="grid"><section class="card"><div class="title">发生了什么</div><div id="changes" class="list"><div class="empty">加载中…</div></div></section><section class="card"><div class="title">正在加速</div><div id="accelerating" class="list"><div class="empty">加载中…</div></div></section></div>
<div class="grid"><section class="card"><div class="title">需要管理层关注</div><div id="attention" class="list"><div class="empty">加载中…</div></div></section><section class="card"><div class="title">需要人工判断</div><div id="human" class="list"><div class="empty">加载中…</div></div></section></div>
<div class="footer" id="release"></div></div>
<script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('executive_terminal.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json(),s=d.summary||{};document.getElementById('summary').innerHTML=[['事件',s.event_count],['加速主题',s.rising_topics],['人工复核',s.review_queue],['证据覆盖',String(s.avg_evidence_coverage??0)+'%']].map(x=>`<div class="hero-card"><div class="muted" style="color:#c6cbd4">${esc(x[0])}</div><strong>${esc(x[1])}</strong></div>`).join('');document.getElementById('changes').innerHTML=(d.what_changed||[]).map(x=>`<div class="item"><div class="row"><strong>${esc(x.title)}</strong><span class="tag ${x.review_required?'warn':'good'}">${x.review_required?'需复核':'可观察'}</span></div><div class="muted">${esc(x.why||'暂无摘要')}</div><div class="small">Trust ${esc(x.trust??'--')} · Evidence ${esc(x.evidence_coverage??'--')}%</div></div>`).join('')||'<div class="empty">暂无事件</div>';document.getElementById('accelerating').innerHTML=(d.what_is_accelerating||[]).map(x=>`<div class="item"><div class="row"><strong>${esc(x.topic||x.title||'未命名')}</strong><span class="tag good">${esc(x.direction||'rising')}</span></div><div class="small">signal ${esc(x.signal_strength??x.score??'--')}</div></div>`).join('')||'<div class="empty">暂无加速主题</div>';document.getElementById('attention').innerHTML=(d.what_needs_attention||[]).map(x=>`<div class="item"><strong>${esc(x.title||x.name||'待关注事项')}</strong><div class="muted">${esc(x.reason||x.message||x.detail||'请查看对应风险证据')}</div></div>`).join('')||'<div class="empty">暂无高优先级事项</div>';document.getElementById('human').innerHTML=(d.what_needs_human_decision||[]).map(x=>`<div class="item"><div class="row"><strong>${esc(x.title||x.subject||'人工复核事项')}</strong><span class="tag warn">Human Review</span></div><div class="muted">${esc(x.reason||x.message||'该事项需要人工判断')}</div></div>`).join('')||'<div class="empty">暂无人工判断事项</div>';const dep=d.release?.deployment||{};document.getElementById('release').textContent=`Release ${d.release?.release_marker||'--'} · source ${d.release?.source_commit||'--'} · deployment ${dep.status||'unknown'} · verified ${dep.verified===true?'yes':'no'}`;}catch(e){document.querySelector('.shell').innerHTML+='<div class="card empty">executive_terminal.json 暂不可用。请先运行 executive_terminal.py 生成管理层情报产物。</div>'}})();
</script></body></html>

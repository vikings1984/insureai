<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsureAI · Knowledge Graph 力导向</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#172033;background:#f4f6f8;line-height:1.5}
*{box-sizing:border-box}
body{margin:0}
.shell{max-width:1340px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:800}.brand span{color:#f97316}
.muted{color:#667085;font-size:13px}
.btn{padding:8px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;text-decoration:none;color:#344054;font-size:13px}
.btn:hover{border-color:#98a2b3}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.bar label{font-size:13px;color:#475467;font-weight:600}
select,input[type=range]{font:inherit}
select{padding:6px 10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}
.stage{position:relative;background:#fff;border:1px solid #e4e7ec;border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;height:620px;cursor:grab}
canvas:active{cursor:grabbing}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid #e4e7ec;border-radius:10px;padding:8px 10px;font-size:12px;color:#475467;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:60%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.meta{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid #e4e7ec;border-radius:10px;padding:6px 10px;font-size:12px;color:#475467}
.tooltip{position:absolute;pointer-events:none;background:#101828;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:260px;z-index:5;line-height:1.4}
.tooltip b{color:#fdba74}
.empty{text-align:center;padding:40px;color:#667085;font-size:13px}
.footer{margin-top:10px;color:#667085;font-size:12px;border-top:1px solid #eaecf0;padding-top:12px}
@media(max-width:760px){canvas{height:460px}.legend{max-width:90%}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div class="brand">Insure<span>AI</span> · Knowledge Graph 力导向</div>
      <div class="muted">按全局度中心性采样 Top-N 实体（Topic 模式取「该 Topic 节点 + 一跳邻居」富化子图）。拖拽节点可重新布局，悬停查看详情。仅聚合既有 fact，不补写未验证结论。</div>
    </div>
    <div>
      <a class="btn" href="./executive_home.html">Executive Home</a>
      <a class="btn" href="./knowledge-graph.html">图谱查看器</a>
      <a class="btn" href="./">主站</a>
      <button class="btn" id="refresh" type="button">刷新</button>
    </div>
  </div>

  <div class="bar">
    <label>Topic
      <select id="topic"><option value="">全部</option></select>
    </label>
    <label>节点数 Top
      <select id="topn">
        <option>40</option><option selected>60</option><option>80</option><option>120</option><option>160</option>
      </select>
    </label>
    <span class="muted" id="hud"></span>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="meta" id="meta"></div>
    <div class="legend" id="legend"></div>
    <div class="tooltip" id="tip"></div>
  </div>

  <div class="footer" id="release"></div>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS={Event:'#f97316',Company:'#2563eb',Claim:'#b42318',Person:'#6941c6',Product:'#067647',Topic:'#475467',Regulation:'#d97706',Evidence:'#0ea5e9'};
const labelFor=n=> (n.title && n.type==='Event') ? n.title : (n.name||n.id);

async function get(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw Error(u+' → HTTP '+r.status); return r.json(); }

let G=null, A=null;            // G=nodes/edges, A=adjacency
let view=null;                 // current rendered graph {nodes,edges}
let dragNode=null, sim=null;

function buildAdj(nodes,edges){
  const m=new Map(); const idset=new Set(nodes.map(n=>n.id));
  for(const n of nodes) m.set(n.id, new Set());
  for(const e of edges){
    if(!idset.has(e.source)||!idset.has(e.target)) continue;
    m.get(e.source).add(e.target); m.get(e.target).add(e.source);
  }
  return m;
}
function degreeOf(nodes,edges){
  const d=new Map(); const idset=new Set(nodes.map(n=>n.id));
  for(const e of edges){
    if(!idset.has(e.source)||!idset.has(e.target)) continue;
    d.set(e.source,(d.get(e.source)||0)+1); d.set(e.target,(d.get(e.target)||0)+1);
  }
  return d;
}

function computeView(topic, topn){
  const deg=degreeOf(G.nodes,G.edges);
  const byId=new Map(G.nodes.map(n=>[n.id,n]));
  let pool;
  if(!topic){
    pool=G.nodes.slice().sort((a,b)=>(deg.get(b.id)||0)-(deg.get(a.id)||0)).slice(0,topn);
  }else{
    const seed=G.nodes.filter(n=>n.topic===topic);
    const A=buildAdj(G.nodes,G.edges);
    const keep=new Set(seed.map(n=>n.id));
    for(const s of seed) for(const nb of (A.get(s.id)||[])) keep.add(nb);
    pool=G.nodes.filter(n=>keep.has(n.id)).sort((a,b)=>(deg.get(b.id)||0)-(deg.get(a.id)||0)).slice(0,topn);
  }
  const inSet=new Set(pool.map(n=>n.id));
  const nodes=pool.map(n=>{
    const dd=deg.get(n.id)||0;
    return {id:n.id, type:n.type, label:labelFor(n), topic:n.topic||'', deg:dd,
      r:4+Math.sqrt(dd)*1.4, color:COLORS[n.type]||'#94a3b8', x:0,y:0,vx:0,vy:0, fixed:false};
  });
  const eset=new Set(nodes.map(n=>n.id));
  const edges=G.edges.filter(e=>eset.has(e.source)&&eset.has(e.target)).map(e=>({
    a:e.source,b:e.target,w:e.confidence||0.5
  }));
  return {nodes,edges,byId};
}

// ---------- force simulation ----------
function initSim(){
  const cv=document.getElementById('cv');
  const W=cv.clientWidth, H=cv.clientHeight;
  for(const n of view.nodes){ n.x=W/2+(Math.random()-0.5)*W*0.6; n.y=H/2+(Math.random()-0.5)*H*0.6; n.vx=0;n.vy=0; }
  if(sim) cancelAnimationFrame(sim.raf);
  sim={alpha:1, raf:0, W, H};
  const nx=new Map(view.nodes.map(n=>[n.id,n]));
  function tick(){
    const a=sim.alpha;
    // repulsion
    for(let i=0;i<view.nodes.length;i++){
      const ni=view.nodes[i];
      for(let j=i+1;j<view.nodes.length;j++){
        const nj=view.nodes[j];
        let dx=ni.x-nj.x, dy=ni.y-nj.y; let d2=dx*dx+dy*dy; if(d2<1) d2=1;
        const f=900/Math.sqrt(d2)/Math.sqrt(d2);
        const d=Math.sqrt(d2); const ux=dx/d, uy=dy/d;
        ni.vx+=ux*f*a; ni.vy+=uy*f*a; nj.vx-=ux*f*a; nj.vy-=uy*f*a;
      }
    }
    // spring
    for(const e of view.edges){
      const a1=nx.get(e.a), b=nx.get(e.b); if(!a1||!b) continue;
      let dx=b.x-a1.x, dy=b.y-a1.y; let d=Math.sqrt(dx*dx+dy*dy)||1;
      const L=70; const f=(d-L)*0.02*a; const ux=dx/d, uy=dy/d;
      a1.vx+=ux*f; a1.vy+=uy*f; b.vx-=ux*f; b.vy-=uy*f;
    }
    // centering + integrate
    for(const n of view.nodes){
      n.vx+=(sim.W/2-n.x)*0.002*a; n.vy+=(sim.H/2-n.y)*0.002*a;
      if(n===dragNode){ n.vx=0; n.vy=0; continue; }
      n.vx*=0.85; n.vy*=0.85;
      n.x+=n.vx; n.y+=n.vy;
    }
    draw();
    sim.alpha*=0.985;
    if(sim.alpha>0.02) sim.raf=requestAnimationFrame(tick);
  }
  tick();
}

function draw(){
  const cv=document.getElementById('cv');
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=1;
  for(const e of view.edges){
    const a=view.nodes.find(n=>n.id===e.a), b=view.nodes.find(n=>n.id===e.b);
    if(!a||!b) continue;
    ctx.strokeStyle='rgba(148,163,184,'+(0.12+e.w*0.35).toFixed(2)+')';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for(const n of view.nodes){
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle='#fff'; ctx.stroke();
  }
}

function bindInteractions(){
  const cv=document.getElementById('cv'); const tip=document.getElementById('tip');
  function pos(ev){ const r=cv.getBoundingClientRect(); const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left; const cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top; return {cx,cy}; }
  function hit(cx,cy){ let best=null,bd=1e9; for(const n of view.nodes){ const d=Math.hypot(n.x-cx,n.y-cy); if(d<n.r+6&&d<bd){bd=d;best=n;} } return best; }
  function down(ev){ const {cx,cy}=pos(ev); const n=hit(cx,cy); if(n){ dragNode=n; n.fixed=true; if(sim) sim.alpha=Math.max(sim.alpha,0.3); ev.preventDefault(); } }
  function move(ev){ const {cx,cy}=pos(ev);
    if(dragNode){ dragNode.x=cx; dragNode.y=cy; if(sim) sim.alpha=Math.max(sim.alpha,0.2); return; }
    const n=hit(cx,cy);
    if(n){ tip.style.opacity=1; tip.style.left=(cx+12)+'px'; tip.style.top=(cy+12)+'px';
      tip.innerHTML='<b>'+esc(n.label)+'</b><br>类型 '+esc(n.type)+(n.topic?' · '+esc(n.topic):'')+'<br>度 '+n.deg; }
    else tip.style.opacity=0;
  }
  function up(){ if(dragNode){ dragNode.fixed=false; dragNode=null; } }
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
}

function renderGraph(){
  const topic=document.getElementById('topic').value;
  const topn=parseInt(document.getElementById('topn').value,10);
  view=computeView(topic, topn);
  document.getElementById('hud').textContent='节点 '+view.nodes.length+' · 关系 '+view.edges.length;
  // legend
  const types=[...new Set(view.nodes.map(n=>n.type))].sort();
  document.getElementById('legend').innerHTML=types.map(t=>'<span><i style="background:'+(COLORS[t]||'#94a3b8')+'"></i>'+esc(t)+'</span>').join('');
  const S=G.stats||{};
  document.getElementById('meta').textContent='v'+esc(G.version)+' · 全图 '+S.node_count+' 节点 / '+S.edge_count+' 关系';
  initSim();
}

function load(){
  get('./knowledge_graph.json').then(g=>{
    G=g;
    const topics=[...new Set(g.nodes.map(n=>n.topic).filter(Boolean))];
    const sel=document.getElementById('topic');
    for(const t of topics){ const o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); }
    sel.value='';
    sel.onchange=renderGraph; document.getElementById('topn').onchange=renderGraph;
    document.getElementById('release').innerHTML='数据来源：knowledge_graph.json（v'+esc(g.version)+' · 更新至 '+(g.stats?.latest_event_at?new Date(g.stats.latest_event_at).toISOString().slice(0,10):'—')+'）。本站仅聚合既有 artifact。';
    renderGraph(); bindInteractions();
  }).catch(e=>{
    document.getElementById('hud').innerHTML='<span style="color:#b42318">图谱加载失败：'+esc(e.message)+'。请通过 GitHub Pages 站点访问。</span>';
  });
}
document.getElementById('refresh').addEventListener('click',load);
window.addEventListener('resize',()=>{ if(view) draw(); });
load();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InsureAI · Knowledge Graph</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#172033;margin:0}.shell{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{font-size:26px;font-weight:750}.muted{color:#667085}.node{padding:10px 12px;border:1px solid #eaecf0;border-radius:10px;margin:8px 0;cursor:pointer}.node:hover{border-color:#0f2c44}.node b{cursor:pointer}.node.on{border-color:#0f2c44;background:#f0f6fc}.edge{font-size:13px;padding:10px;border-bottom:1px solid #eaecf0}.pill{display:inline-block;background:#f2f4f7;border-radius:999px;padding:3px 8px;font-size:12px;margin-right:5px}.pill.tp{background:#eef4fa;color:#0f2c44}.pill.ty{background:#eefaf2;color:#1a7f4b}.pill.ct{background:#fdf1ec;color:#b3452e}.pill.cl{background:#f3eefa;color:#6d3fbf}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar input[type=text]{flex:1;min-width:220px;padding:9px 12px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}.toolbar select{padding:8px 10px;border:1px solid #d0d5dd;border-radius:8px;font-size:13px;max-width:260px}.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#47546a;white-space:nowrap}.chk input{transform:scale(1.15)}.topicbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.topic{border:1px solid #dbe4ec;background:#f8fafc;color:#475569;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}.topic.on{background:#0f2c44;color:#fff;border-color:#0f2c44}.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.qhead h2{margin:0}.qnote{font-size:12px;color:#667085}.timeline{margin-top:8px}.titem{padding:9px 0;border-bottom:1px solid #eef2f5}.titem .t{font-size:12px}.titem small{color:#667085}.matchlist{max-height:300px;overflow:auto;margin-top:8px}.empty{color:#667085;padding:10px 0}.xent{padding:9px 0;border-bottom:1px solid #eef2f5}.xent .xtopics{margin-top:4px}.sec{margin-top:14px}.kv{font-size:12px;color:#667085;margin-top:2px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style>
</head><body><div class="shell"><div class="bar"><div><h1>InsureAI · Knowledge Graph</h1><div class="muted">Company / Event / Claim / Evidence / Topic 的可追溯关系图谱 · 支持实体查询 / 90 天时间窗 / 邻居展开</div></div><a href="./">返回主站</a></div>
<div id="kpis" class="grid"></div>
<div class="card"><div class="toolbar">
  <input id="q" type="text" placeholder="搜索实体（如 Munich Re / 平安保险），点击结果展开邻居与 90 天动向">
  <label class="chk"><input id="win" type="checkbox" checked> 90 天时间窗</label>
  <span id="wininfo" class="muted" style="font-size:12px"></span>
</div>
<div id="matches" class="matchlist"></div>
<div id="neigh" class="sec"></div></div>
<div class="card"><div class="qhead"><h2>预置查询一 · 某主体最近 90 天发生了什么</h2><span class="qnote">实体 → 邻接 Event / Claim（窗口锚定最新事件时间）</span></div><div id="pq1" class="timeline"></div></div>
<div class="card"><div class="qhead"><h2>预置查询二 · 哪些主体同时在多个 Topic 布局</h2><span class="qnote">Topic × Entity 交叉（选择 2 个及以上 Topic）</span></div>
<div id="topics" class="topicbox"></div>
<div id="pq2" class="sec"></div></div>
<div class="card"><h2>关键节点</h2><div id="nodes">加载中…</div></div>
<div class="card"><h2>关键关系</h2><div id="edges">加载中…</div></div></div>
<script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE_CLS={Company:'tp',Person:'ty',Event:'ct',Claim:'cl',Topic:'tp',Evidence:'',Product:'tp',Regulation:'ty'};
const TOPIC_LABELS={ai_intelligent:'AI 智能',capital_reinsurance:'资本与再保',channel_transformation:'渠道转型',climate_catastrophe:'巨灾风险',digital_transformation:'数字化',pension_finance:'养老金融',product_innovation:'产品创新',regulatory_change:'监管变化'};
try{const r=await fetch('knowledge_graph.json?t='+Date.now());if(!r.ok)throw 0;const g=await r.json();
const NODES=g.nodes,EDGES=g.edges,STATS=g.stats;
const byId={};for(const n of NODES)byId[n.id]=n;
const idx={};for(const n of NODES){(idx[(n.name||'').toLowerCase()]??=[]).push(n);}
const adj={};for(const e of EDGES){(adj[e.source]??=[]).push([e,byId[e.target]]);(adj[e.target]??=[]).push([e,byId[e.source]]);}
const latest=(STATS.latest_event_at||'').replace('T',' ').slice(0,16);
const winEnd=latest?new Date(latest):new Date();const winStart=new Date(winEnd-90*864e5);
const inWin=t=>{const box=document.getElementById('win');if(!box||!box.checked)return true;if(!t)return true;const d=new Date(String(t).replace('Z',''));return d>=winStart&&d<=new Date(winEnd.getTime()+864e5);};
document.getElementById('kpis').innerHTML=[['节点',STATS.node_count],['关系',STATS.edge_count],['事件',STATS.event_count],['Claim',STATS.claim_count],['最新事件',latest||'—']].map(x=>`<div class="card"><div class="kpi">${esc(x[1])}</div><div class="muted">${esc(x[0])}</div></div>`).join('');
document.getElementById('wininfo').textContent=latest?`窗口 ${winStart.toISOString().slice(0,10)} ~ ${latest.slice(0,10)}`:'';
const $=id=>document.getElementById(id);
let selectedNode=null,selectedTopic=new Set(['ai_intelligent','product_innovation']);
function pill(n){return `<span class="pill ${TYPE_CLS[n.type]||''}">${esc(n.type)}</span>`;}
function renderMatches(q){const ql=(q||'').trim().toLowerCase();const box=$('matches');if(!ql){box.innerHTML='';return;}
let hits=NODES.filter(n=>n.type!=='Evidence'&&n.type!=='Event'&&String(n.name||'').toLowerCase().includes(ql));
const shown=hits.slice(0,20);box.innerHTML=shown.length?shown.map(n=>`<div class="node${selectedNode&&selectedNode.id===n.id?' on':''}" data-id="${esc(n.id)}">${pill(n)}<b>${esc(n.name)}</b> <span class="muted" style="font-size:12px">${(adj[n.id]||[]).length} 个关联</span></div>`).join(''):'<div class="empty">无匹配实体</div>';
box.querySelectorAll('.node').forEach(el=>el.addEventListener('click',()=>{selectNode(byId[el.dataset.id]);renderMatches($('q').value);}));}
function selectNode(n){selectedNode=n;renderNeighbors(n);renderPQ1(n);}
function renderNeighbors(n){const rows=(adj[n.id]||[]).map(([e,o])=>({n:o,rel:e.relationship,dir:e.source===n.id?'out':'in',conf:e.confidence})).sort((a,b)=>a.n.type.localeCompare(b.n.type)||b.conf-a.conf);
$('neigh').innerHTML=`<div class="qhead"><h3 style="margin:0">邻居展开 · ${esc(n.name)}</h3><span class="qnote">${rows.length} 个一跳邻居</span></div>`+(rows.length?rows.slice(0,60).map(r=>`<div class="node" data-id="${esc(r.n.id)}">${pill(r.n)}<b>${esc(r.n.name)}</b><div class="kv">${esc(r.dir==='out'?'→':'←')} ${esc(r.rel)} · confidence ${esc(r.conf)}</div>${r.n.title?`<div class="kv">${esc(r.n.title)}</div>`:''}${r.n.claim_text?`<div class="kv">${esc(r.n.claim_text)}</div>`:''}</div>`).join(''):'<div class="empty">无邻居</div>');
$('neigh').querySelectorAll('.node').forEach(el=>el.addEventListener('click',()=>{selectNode(byId[el.dataset.id]);renderMatches($('q').value);window.scrollTo({top:0,behavior:'smooth'});}));}
function renderPQ1(n){const events=[],claims=[],seen=new Set();
for(const[,o]of(adj[n.id]||[])){if(o.type==='Event'&&inWin(o.published_at))events.push(o);else if(o.type==='Claim'){let at=null;for(const[,c]of(adj[o.id]||[]))if(c.type==='Event'){at=c.published_at;break;}if(inWin(at))claims.push({c:o,at});}}
events.sort((a,b)=>String(b.published_at||'').localeCompare(String(a.published_at||'')));claims.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
const rows=[...events.map(e=>({t:e.published_at,html:`<div class="titem"><div class="t"><b>${esc(e.title||e.name)}</b></div><small>${esc(String(e.published_at||'').slice(0,10))} · ${esc(TOPIC_LABELS[e.topic]||e.topic||'')} · 可信度 ${esc((e.trust||{}).level||'-')} · 来源 ${esc(e.source_count??'-')}</small></div>`})),
...claims.map(({c,at})=>({t:at,html:`<div class="titem"><div class="t">${pill(c)}${esc(c.claim_text||c.name)}</div><small>${esc(String(at||'').slice(0,10))} · ${esc(c.claim_type||'')} · ${esc(c.verification_status||'')} · confidence ${esc(c.confidence??'-')}</small></div>`}))].sort((a,b)=>String(b.t||'').localeCompare(String(a.t||'')));
$('pq1').innerHTML=selectedNode?`<div class="qnote">「${esc(n.name)}」最近 90 天：${events.length} 个事件 · ${claims.length} 条 Claim</div><div class="timeline">${rows.map(x=>x.html).join('')||'<div class="empty">时间窗内无事件</div>'}</div>`:'<div class="empty">先在上方搜索并选择一个实体。</div>';}
function renderTopics(){const topics=NODES.filter(n=>n.type==='Topic');
$('topics').innerHTML=topics.map(t=>`<button type="button" class="topic${selectedTopic.has(t.name)?' on':''}" data-t="${esc(t.name)}">${esc(TOPIC_LABELS[t.name]||t.name)} (${(adj[t.id]||[]).length})</button>`).join('');
$('topics').querySelectorAll('.topic').forEach(el=>el.addEventListener('click',()=>{const t=el.dataset.t;selectedTopic.has(t)?selectedTopic.delete(t):selectedTopic.add(t);renderTopics();renderPQ2();}));}
function renderPQ2(){if(selectedTopic.size<2){$('pq2').innerHTML='<div class="empty">至少选择 2 个 Topic 才能交叉。</div>';return;}
const out=[];
for(const n of NODES){if(n.type!=='Company'&&n.type!=='Person')continue;const shared={};
for(const[,o]of(adj[n.id]||[])){if(o.type!=='Event')continue;const t=o.topic;if(selectedTopic.has(t))(shared[t]??=[]).push(o);}
if(Object.keys(shared).length===selectedTopic.size)out.push({n,shared,count:Object.values(shared).reduce((s,v)=>s+v.length,0)});}
out.sort((a,b)=>b.count-a.count);
$('pq2').innerHTML=`<div class="qnote">${[...selectedTopic].map(t=>TOPIC_LABELS[t]||t).join(' × ')}：${out.length} 个主体同时在所有选定 Topic 上有事件</div>`+(out.length?out.slice(0,20).map(x=>`<div class="xent">${pill(x.n)}<b>${esc(x.n.name)}</b> <span class="muted" style="font-size:12px">${x.count} 个事件</span><div class="xtopics">${Object.entries(x.shared).map(([t,evs])=>`<span class="pill">${esc(TOPIC_LABELS[t]||t)} ${evs.length}</span>`).join(' ')}</div></div>`).join(''):'<div class="empty">没有主体同时覆盖这些 Topic。</div>');}
$('q').addEventListener('input',e=>renderMatches(e.target.value));
$('win').addEventListener('change',()=>{renderPQ1(selectedNode||{id:'',name:'—'});renderKeyCards();});
renderTopics();renderPQ2();renderPQ1(selectedNode||{id:'',name:'—'});
function renderKeyCards(){const evNodes=NODES.filter(n=>n.type==='Event'&&inWin(n.published_at));
const evIds=new Set(evNodes.map(n=>n.id));
$('nodes').innerHTML=NODES.filter(n=>n.type!=='Evidence'&&n.type!=='Event'&&(adj[n.id]||[]).some(([,o])=>evIds.has(o.id))).slice(0,50).map(n=>`<div class="node" data-id="${esc(n.id)}">${pill(n)}<b>${esc(n.name)}</b><div class="muted">${esc(n.id)}</div></div>`).join('')||'<div class="muted">暂无数据</div>';
$('nodes').querySelectorAll('.node').forEach(el=>el.addEventListener('click',()=>{selectNode(byId[el.dataset.id]);window.scrollTo({top:0,behavior:'smooth'});}));
$('edges').innerHTML=EDGES.filter(e=>evIds.has(e.source)||evIds.has(e.target)).slice(0,80).map(e=>`<div class="edge"><span class="pill">${esc(e.relationship)}</span>${esc(e.source)} → ${esc(e.target)} <span class="muted">confidence=${esc(e.confidence)}</span></div>`).join('')||'<div class="muted">暂无关系</div>';}
renderKeyCards();
}catch(e){document.getElementById('nodes').textContent='暂无 knowledge_graph.json；请先运行知识图谱流水线。';document.getElementById('edges').textContent='暂无关系数据。'}})();
</script></body></html>

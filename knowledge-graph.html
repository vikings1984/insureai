<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InsureAI · Knowledge Graph</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#172033;margin:0}.shell{max-width:1200px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{font-size:28px;font-weight:750}.muted{color:#667085}.node{padding:12px;border:1px solid #eaecf0;border-radius:10px;margin:8px 0}.edge{font-size:13px;padding:10px;border-bottom:1px solid #eaecf0}.pill{display:inline-block;background:#f2f4f7;border-radius:999px;padding:3px 8px;font-size:12px;margin-right:5px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style>
</head><body><div class="shell"><div class="bar"><div><h1>InsureAI · Knowledge Graph</h1><div class="muted">Company / Event / Claim / Evidence / Topic 的可追溯关系图谱</div></div><a href="./">返回主站</a></div><div id="kpis" class="grid"></div><div class="card"><h2>关键节点</h2><div id="nodes">加载中…</div></div><div class="card"><h2>关键关系</h2><div id="edges">加载中…</div></div></div><script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch('knowledge_graph.json?t='+Date.now());if(!r.ok)throw 0;const g=await r.json();document.getElementById('kpis').innerHTML=[['节点',g.stats.node_count],['关系',g.stats.edge_count],['事件',g.stats.event_count],['Claim',g.stats.claim_count]].map(x=>`<div class="card"><div class="kpi">${esc(x[1])}</div><div class="muted">${esc(x[0])}</div></div>`).join('');document.getElementById('nodes').innerHTML=g.nodes.slice(0,50).map(n=>`<div class="node"><span class="pill">${esc(n.type)}</span><strong>${esc(n.name)}</strong><div class="muted">${esc(n.id)}</div></div>`).join('')||'<div class="muted">暂无数据</div>';document.getElementById('edges').innerHTML=g.edges.slice(0,80).map(e=>`<div class="edge"><span class="pill">${esc(e.relationship)}</span>${esc(e.source)} → ${esc(e.target)} <span class="muted">confidence=${esc(e.confidence)}</span></div>`).join('')||'<div class="muted">暂无关系</div>'}catch(e){document.getElementById('nodes').textContent='暂无 knowledge_graph.json；请先运行知识图谱流水线。';document.getElementById('edges').textContent='暂无关系数据。'}})();
</script></body></html>
